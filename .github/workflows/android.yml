name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unlock the signing key
        env:
          IT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$IT_KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEY_PASSWORD is not set yet: building an unsigned test copy only (not published)"
            echo "HAVE_KEY=0" >> "$GITHUB_ENV"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$RUNNER_TEMP/release.jks" -pass env:IT_KEY_PASSWORD
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          IT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export IT_KEYSTORE="$RUNNER_TEMP/release.jks"
          set -o pipefail
          if [ "$HAVE_KEY" = "1" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle -p android $TASK --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Name the APK
        if: env.HAVE_KEY == '1'
        run: |
          V=$(tr -d '[:space:]' < android/version.txt)
          cp android/app/build/outputs/apk/release/app-release.apk InfinityTimetable.apk
          cp InfinityTimetable.apk "InfinityTimetable-$V.apk"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Publish the download
        if: env.HAVE_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Infinity Timetable $V for Android phones and tablets (Android 7 or newer).

          How to install: open InfinityTimetable.apk on the phone. If Android asks, allow installing apps from this source, then tap Install.
          Updating: install the new APK over the old one. Your timetables and licence are kept."
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --target "$GITHUB_SHA" --title "Infinity Timetable for Android $V" --notes "$NOTES" --latest=false
          fi
          gh release upload android InfinityTimetable.apk "InfinityTimetable-$V.apk" --clobber
          gh release edit android --title "Infinity Timetable for Android $V" --notes "$NOTES"

      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          git init -q && git checkout -q -b ci-logs
          git config user.name "Infinity Timetable build"
          git config user.email "infinitytimetable@users.noreply.github.com"
          {
            echo "status: ${{ job.status }}"
            echo "signed: ${HAVE_KEY:-0}"
            ls -la "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/*/ 2>/dev/null | sed 's/^/apk: /' 
            echo "version: ${V:-unknown}"
            echo "commit: $GITHUB_SHA"
            echo "time: $(date -u)"
          } > android-status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then tail -n 400 "$GITHUB_WORKSPACE/build.log" > android-build-log.txt; fi
          git add -A && git commit -q -m "Android build report: ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
