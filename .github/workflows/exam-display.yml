name: Build Exam Display app

on:
  push:
    branches: [main]
    paths: ['exam-display/**', '.github/workflows/exam-display.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exam-display
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unlock the signing key
        env:
          IT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$IT_KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEY_PASSWORD is not set yet: building an unsigned test copy only (not published)"
            echo "HAVE_KEY=0" >> "$GITHUB_ENV"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$RUNNER_TEMP/release.jks" -pass env:IT_KEY_PASSWORD
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          IT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export IT_KEYSTORE="$RUNNER_TEMP/release.jks"
          set -o pipefail
          if [ "$HAVE_KEY" = "1" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle -p exam-display $TASK --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Name the APK
        if: env.HAVE_KEY == '1'
        run: |
          V=$(tr -d '[:space:]' < exam-display/version.txt)
          cp exam-display/app/build/outputs/apk/release/app-release.apk ExamDisplay.apk
          cp ExamDisplay.apk "ExamDisplay-$V.apk"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Publish the download
        if: env.HAVE_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Exam Display $V: shows the exam details (subject, syllabus and component codes, duration, start, finish, five-minute warning and time left) full screen on the classroom board during examinations. Android 7 or newer, works offline.

          How to install on the board: copy ExamDisplay.apk to the board (USB stick or download), open it, allow installing from this source if asked, then tap Install.
          Updating: install the new APK over the old one. Your papers, subjects and settings are kept."
          if ! gh release view exam-display >/dev/null 2>&1; then
            gh release create exam-display --target "$GITHUB_SHA" --title "Exam Display $V" --notes "$NOTES" --latest=false
          fi
          gh release upload exam-display ExamDisplay.apk "ExamDisplay-$V.apk" --clobber
          gh release edit exam-display --title "Exam Display $V" --notes "$NOTES"

      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          git init -q && git checkout -q -b ci-logs-exam
          git config user.name "Infinity Timetable build"
          git config user.email "infinitytimetable@users.noreply.github.com"
          {
            echo "status: ${{ job.status }}"
            echo "signed: ${HAVE_KEY:-0}"
            ls -la "$GITHUB_WORKSPACE"/exam-display/app/build/outputs/apk/*/ 2>/dev/null | sed 's/^/apk: /' 
            echo "version: ${V:-unknown}"
            echo "commit: $GITHUB_SHA"
            echo "time: $(date -u)"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then tail -n 400 "$GITHUB_WORKSPACE/build.log" > build-log.txt; fi
          git add -A && git commit -q -m "Exam Display build report: ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-exam
