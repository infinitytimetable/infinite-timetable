plugins {
    id 'com.android.application'
}

def appVersion = file('../version.txt').text.trim()
def parts = appVersion.tokenize('.').collect { it as int }
def code = parts[0] * 10000 + parts[1] * 100 + (parts.size() > 2 ? parts[2] : 0)

android {
    namespace 'com.infinitytimetable.examdisplay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.infinitytimetable.examdisplay'
        minSdk 24
        targetSdk 34
        versionCode code
        versionName appVersion
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('IT_KEYSTORE') ?: 'missing.jks')
            storePassword System.getenv('IT_KEY_PASSWORD') ?: ''
            keyAlias 'infinity'
            keyPassword System.getenv('IT_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
