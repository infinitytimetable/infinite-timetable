<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Display</title>
<style>
:root{--bg:#0d1b33;--panel:#13264a;--line:rgba(255,255,255,.12);--fg:#f4f7fb;--muted:#9fb0cc;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:"Consolas","Roboto Mono","SFMono-Regular",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
/* ---------- board ---------- */
#board{position:fixed;inset:0;display:flex;flex-direction:column;padding:1.6vw 2vw 1.2vw;gap:1.2vw;background:radial-gradient(90vw 60vh at 10% -10%,#1d3a6e 0,transparent 60%),radial-gradient(70vw 60vh at 100% 110%,#162d57 0,transparent 60%),var(--bg);overflow:hidden}
.bhead{display:flex;align-items:center;gap:1.4vw}
.blogo{height:6.2vw;width:6.2vw;object-fit:contain;border-radius:.8vw;background:#fff;padding:.3vw}
.bschool{flex:1;min-width:0}
.bschool h1{margin:0;font-size:2.5vw;line-height:1.1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bschool p{margin:.3vw 0 0;font-size:1.35vw;color:var(--muted)}
.bschool p b{color:var(--fg);font-weight:600}
.bclock{text-align:right}
.bclock .t{font:700 6vw/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bclock .t small{font-size:2.6vw;color:var(--muted);margin-left:.4vw}
.bclock .d{font-size:1.35vw;color:var(--muted);margin-top:.3vw}
.bpapers{flex:1;display:grid;gap:1.2vw;min-height:0}
.paper{--u:min(1vw,1.85vh);position:relative;display:flex;flex-direction:column;border-radius:1.4vw;padding:calc(var(--u)*1.4*var(--k)) calc(var(--u)*1.8*var(--k)) calc(var(--u)*1.6*var(--k));background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:.15vw solid var(--line);box-shadow:0 1.5vw 3vw -1.5vw rgba(0,0,0,.6);min-height:0;overflow:hidden;transition:background .6s,border-color .6s}
.paper header{display:flex;align-items:flex-start;gap:1vw}
.paper .subj{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:calc(var(--u)*4.4*var(--k));font-weight:800;line-height:1.05;margin:0}
.paper .lvl{font-size:calc(var(--u)*2*var(--k));color:var(--muted);margin:calc(var(--u)*.2*var(--k)) 0 0}
.paper .pbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--u)*1.2*var(--k));margin-top:calc(var(--u)*1*var(--k))}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*.9*var(--k)) calc(var(--u)*1.6*var(--k));margin:0;align-content:center;font-size:calc(var(--u)*2.2*var(--k))}
.paper dt{color:var(--muted)}
.paper dd{margin:0;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.paper .left{display:flex;align-items:baseline;justify-content:space-between;gap:1vw;border-top:.15vw solid var(--line);padding-top:calc(var(--u)*.9*var(--k))}
.paper .left span{font-size:calc(var(--u)*2*var(--k));color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.paper .left b{font:800 calc(var(--u)*6.4*var(--k))/1 var(--mono);font-variant-numeric:tabular-nums}
.bpapers.wide .paper .pbody{flex-direction:row;align-items:center}
.bpapers.wide .paper dl{flex:1}
.bpapers:not(.wide) .paper dl{margin:auto 0}
.bpapers.wide .paper .left{flex-direction:column;align-items:center;justify-content:center;border-top:0;border-left:.15vw solid var(--line);padding:0 0 0 calc(var(--u)*2.4*var(--k));align-self:stretch;gap:calc(var(--u)*1*var(--k))}
.bpapers.wide .paper .left b{font-size:calc(var(--u)*9*var(--k))}
.paper .bar{position:absolute;left:0;right:0;bottom:0;height:.5vw;background:rgba(255,255,255,.08)}
.paper .bar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.paper.st-wait .left b{color:var(--muted)}
.paper.st-run{border-color:rgba(59,130,246,.5)}
.paper.st-run .left b{color:#93c5fd}
.paper.st-warn{background:linear-gradient(170deg,rgba(245,158,11,.32),rgba(245,158,11,.12));border-color:var(--warn)}
.paper.st-warn .left b,.paper.st-warn .left span{color:#fde68a}
.paper.st-warn .bar i{background:var(--warn)}
.paper.st-end{background:linear-gradient(170deg,rgba(239,68,68,.38),rgba(239,68,68,.16));border-color:var(--bad)}
.paper.st-end .left b,.paper.st-end .left span{color:#fecaca}
.paper.st-end .bar i{background:var(--bad)}
.paper .tag{flex:none;font-size:calc(var(--u)*1.6*var(--k));font-weight:800;padding:.35em .9em;border-radius:999px;background:rgba(255,255,255,.1);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.paper.st-warn .tag{background:var(--warn);color:#2a1800}
.paper.st-end .tag{background:var(--bad);color:#fff}
.paper.st-run .tag{background:var(--acc)}
.bempty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1vw;border:.2vw dashed var(--line);border-radius:1.4vw;color:var(--muted);font-size:1.8vw;text-align:center}
.brules{display:flex;gap:1.2vw;align-items:center;padding:.9vw 1.4vw;border-radius:1vw;background:rgba(255,255,255,.06);border:.12vw solid var(--line);font-size:1.45vw}
.brules ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.4vw 2.2vw}
.brules li::before{content:"•";color:var(--warn);margin-right:.6vw}
.brules .ic{font-size:2vw}
#gear{position:fixed;right:.6vw;bottom:.6vw;width:3.4vw;height:3.4vw;min-width:44px;min-height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:1.6vw;cursor:pointer;opacity:.35;transition:opacity .2s}
#gear:hover,#gear:focus{opacity:1}
/* ---------- setup ---------- */
#setup{min-height:100%;background:#eef2f8;color:#14213d;padding:24px clamp(14px,3vw,40px) 120px}
#setup .wrap{max-width:1180px;margin:0 auto}
.stop{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.stop h1{margin:0;font-size:28px;flex:1}
.stop h1 small{display:block;font-size:14px;color:#5b6b85;font-weight:500}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px -12px rgba(16,30,54,.18);border:1px solid #e2e8f2}
.card h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px}
.card h2 .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:#5b6b85;font-weight:600}
.in{border:1px solid #cdd6e4;border-radius:10px;padding:10px 12px;font-size:17px;background:#fff;color:#14213d;min-height:46px;width:100%}
.in:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
textarea.in{min-height:120px;resize:vertical;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #cdd6e4;background:linear-gradient(#fff,#f3f6fb);border-radius:10px;padding:10px 16px;font-size:16px;font-weight:600;color:#14213d;cursor:pointer;min-height:46px;box-shadow:0 1px 2px rgba(16,30,54,.08)}
.btn:hover{border-color:#9fb0cc}
.btn.pri{background:linear-gradient(#4b8ef7,#2563eb);color:#fff;border-color:#1d4ed8;box-shadow:0 4px 14px -4px rgba(37,99,235,.6)}
.btn.big{font-size:20px;padding:14px 26px;min-height:58px}
.btn.danger{color:#b91c1c}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;gap:14px;align-items:center;border:1px solid #e2e8f2;border-radius:12px;padding:12px 14px;background:#f8fafd;flex-wrap:wrap}
.pitem .pi{flex:1;min-width:220px}
.pitem .pi b{font-size:18px;display:block}
.pitem .pi span{color:#5b6b85;font-size:14px;font-family:var(--mono)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#e2e8f2;color:#334155}
.pill.run{background:#dbeafe;color:#1d4ed8}.pill.warn{background:#fef3c7;color:#92400e}.pill.end{background:#fee2e2;color:#b91c1c}
.muted{color:#5b6b85}
.calc{display:flex;gap:18px;flex-wrap:wrap;background:#f1f5fb;border-radius:10px;padding:10px 14px;font-size:15px}
.calc b{font-family:var(--mono);font-size:18px}
.subjects{max-height:420px;overflow:auto;border:1px solid #e2e8f2;border-radius:12px}
.subjects table{width:100%;border-collapse:collapse;font-size:15px}
.subjects th{position:sticky;top:0;background:#f1f5fb;text-align:left;padding:8px 10px;font-size:13px;color:#5b6b85}
.subjects td{padding:6px 10px;border-top:1px solid #eef2f8}
.subjects td .in{min-height:38px;padding:6px 8px;font-size:15px}
.logoprev{height:64px;width:64px;object-fit:contain;border:1px solid #e2e8f2;border-radius:10px;background:#fff}
.note{font-size:13px;color:#5b6b85}
#dlg{position:fixed;inset:0;background:rgba(10,20,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#dlg .box{background:#fff;color:#14213d;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
#dlg h3{margin:0 0 14px;font-size:22px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg button{border:1px solid #cdd6e4;background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="board" hidden></div>
<button id="gear" hidden aria-label="Set up papers" title="Set up papers" data-act="setup">⚙</button>
<div id="setup"></div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ===== Exam Display: shows the exam details on the classroom board ===== */
var VERSION='1.0.0';
/* Cambridge subjects and syllabus codes. Schools can add, change or remove any of them in Set up. */
var CAMBRIDGE=[
 ['IGCSE','0452','Accounting'],['IGCSE','0606','Additional Mathematics'],['IGCSE','0400','Art and Design'],['IGCSE','0610','Biology'],['IGCSE','0450','Business Studies'],
 ['IGCSE','0620','Chemistry'],['IGCSE','0653','Combined Science'],['IGCSE','0478','Computer Science'],['IGCSE','0654','Co-ordinated Sciences (Double Award)'],['IGCSE','0445','Design and Technology'],
 ['IGCSE','0455','Economics'],['IGCSE','0500','English – First Language'],['IGCSE','0510','English as a Second Language (Speaking endorsement)'],['IGCSE','0511','English as a Second Language (Count-in speaking)'],
 ['IGCSE','0475','Literature in English'],['IGCSE','0648','Food and Nutrition'],['IGCSE','0520','French – Foreign Language'],['IGCSE','0460','Geography'],['IGCSE','0457','Global Perspectives'],
 ['IGCSE','0470','History'],['IGCSE','0417','Information and Communication Technology'],['IGCSE','0607','International Mathematics'],['IGCSE','0580','Mathematics'],['IGCSE','0410','Music'],
 ['IGCSE','0413','Physical Education'],['IGCSE','0625','Physics'],['IGCSE','0490','Religious Studies'],['IGCSE','0495','Sociology'],['IGCSE','0530','Spanish – Foreign Language'],
 ['IGCSE','0471','Travel and Tourism'],['IGCSE','0680','Environmental Management'],['IGCSE','0493','Islamic Studies'],['IGCSE','0547','Mandarin Chinese – Foreign Language'],['IGCSE','0525','German – Foreign Language'],
 ['AS & A Level','9706','Accounting'],['AS & A Level','9479','Art and Design'],['AS & A Level','9700','Biology'],['AS & A Level','9609','Business'],['AS & A Level','9701','Chemistry'],
 ['AS & A Level','9618','Computer Science'],['AS & A Level','9705','Design and Technology'],['AS & A Level','9708','Economics'],['AS & A Level','9093','English Language'],['AS & A Level','9695','Literature in English'],
 ['AS & A Level','9231','Further Mathematics'],['AS & A Level','9696','Geography'],['AS & A Level','9239','Global Perspectives and Research'],['AS & A Level','9489','History'],['AS & A Level','9626','Information Technology'],
 ['AS & A Level','9084','Law'],['AS & A Level','9709','Mathematics'],['AS & A Level','9483','Music'],['AS & A Level','9396','Physical Education'],['AS & A Level','9702','Physics'],
 ['AS & A Level','9990','Psychology'],['AS & A Level','9699','Sociology'],['AS & A Level','9395','Travel and Tourism'],['AS & A Level','9607','Media Studies'],['AS & A Level','9693','Marine Science'],
 ['AS & A Level','9488','Islamic Studies'],['AS & A Level','8021','English General Paper'],['AS & A Level','9274','Classical Studies'],['AS & A Level','9631','Design and Textiles']
];
var RULES_DEF='Switch off and hand in all mobile phones and smart watches\nNo talking once you enter the exam room\nWrite your centre number, candidate number and name on every page\nRaise your hand if you need help or more paper\nDo not leave the room without permission';
var KEY='examdisplay.v1',S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
  if(!S||typeof S!=='object')S={};S.school=S.school||'';S.centre=S.centre||'';S.room=S.room||'';S.logo=S.logo||'';S.rules=S.rules==null?RULES_DEF:S.rules;S.showRules=S.showRules!==false;
  S.subjects=Array.isArray(S.subjects)&&S.subjects.length?S.subjects:CAMBRIDGE.map(function(x,i){return {id:'c'+i,level:x[0],code:x[1],name:x[2]};});
  S.papers=Array.isArray(S.papers)?S.papers:[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save on this device (storage is full)');}}
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true;},2600);}
function todayISO(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
/* times are "HH:MM" on the paper's date */
function at(date,hm){var p=String(hm||'').split(':');if(p.length<2)return null;var d=new Date(date+'T00:00:00');if(isNaN(d))return null;d.setHours(+p[0],+p[1],0,0);return d;}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function times(p){var st=at(p.date,p.start);if(!st||!(p.dur>0))return null;var fin=new Date(st.getTime()+p.dur*60000),warn=new Date(fin.getTime()-5*60000);return {st:st,fin:fin,warn:warn};}
function status(p,now){var t=times(p);if(!t)return {k:'wait',t:null};if(now<t.st)return {k:'wait',t:t};if(now>=t.fin)return {k:'end',t:t};if(now>=t.warn)return {k:'warn',t:t};return {k:'run',t:t};}
function dur(ms){ms=Math.max(0,Math.round(ms/1000));var h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+':'+pad(m):m)+':'+pad(s);}
function durMin(m){m=+m||0;var h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r+' min':'')):r+' min';}
function code(p){return p.code+(p.comp?'/'+p.comp:'');}
function todays(){var d=todayISO();return S.papers.filter(function(p){return p.date===d;}).sort(function(a,b){return String(a.start).localeCompare(String(b.start));});}
/* ---------- the board ---------- */
var view='setup';
function showBoard(){view='board';$('#setup').hidden=true;$('#board').hidden=false;$('#gear').hidden=false;try{var el=document.documentElement;if(!window.ITExam&&el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().catch(function(){});}catch(e){}drawBoard();tick();}
function showSetup(){view='setup';$('#board').hidden=true;$('#gear').hidden=true;$('#setup').hidden=false;drawSetup();}
function drawBoard(){var b=$('#board'),ps=todays(),n=ps.length;
  var cols=n<=1?1:n===2?2:n===3?3:2,rows=n<=3?1:2;
  var sc='--k:'+(n<=1?1.15:n===2?.9:n===3?.7:.75);
  var rules=S.showRules?S.rules.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean):[];
  b.innerHTML='<div class="bhead">'+(S.logo?'<img class="blogo" src="'+esc(S.logo)+'" alt="">':'')+'<div class="bschool"><h1>'+esc(S.school||'Examinations')+'</h1><p>'+
    (S.centre?'Centre number <b>'+esc(S.centre)+'</b>':'')+(S.centre&&S.room?' · ':'')+(S.room?esc(S.room):'')+'</p></div>'+
    '<div class="bclock"><div class="t" id="bclock">--:--</div><div class="d" id="bdate"></div></div></div>'+
    '<div class="bpapers'+(n&&(n<=2||n===4)?' wide':'')+'" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));grid-template-rows:repeat('+rows+',minmax(0,1fr));'+sc+'">'+
    (n?ps.map(function(p){var t=times(p);return '<section class="paper" data-id="'+p.id+'"><header><h2 class="subj">'+esc(p.name)+'</h2><span class="tag" data-r="tag"></span></header><p class="lvl">'+esc(p.level||'')+'</p>'+
      '<div class="pbody"><dl><dt>Syllabus code</dt><dd>'+esc(p.code)+'</dd><dt>Component (paper) code</dt><dd>'+esc(p.comp?code(p):'–')+'</dd><dt>Duration</dt><dd>'+esc(p.dur)+' minutes</dd>'+
      '<dt>Start time</dt><dd>'+(t?hm(t.st):'–')+'</dd><dt>Finish time</dt><dd>'+(t?hm(t.fin):'–')+'</dd><dt>Five-minute warning</dt><dd>'+(t?hm(t.warn):'–')+'</dd></dl>'+
      '<div class="left"><span data-r="lab">Time left</span><b data-r="left">–</b></div></div><div class="bar"><i data-r="bar"></i></div></section>';}).join(''):
      '<div class="bempty" style="grid-column:1/-1"><div style="font-size:4vw">📝</div>No papers set for today.<br>Tap ⚙ in the corner to add the papers for this room.</div>')+'</div>'+
    (rules.length?'<div class="brules"><span class="ic">⚠️</span><ul>'+rules.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div>':'');
  fitPapers();tick();}
/* shrink the text until every paper fits its box (big boards, small screens, long names) */
function fitPapers(){var box=document.querySelector('#board .bpapers');if(!box)return;var k=parseFloat(box.style.getPropertyValue('--k'))||1;
  [].forEach.call(box.querySelectorAll('.paper'),function(e){e.querySelector('[data-r=left]').textContent='8:88:88';e.querySelector('[data-r=tag]').textContent='Five minutes';e.querySelector('[data-r=lab]').textContent='Stop writing';});
  var over=function(){return [].some.call(box.querySelectorAll('.paper'),function(e){var h=e.querySelector('.subj'),pb=e.querySelector('.pbody'),dl=pb.querySelector('dl'),lf=pb.querySelector('.left');
    var wide=box.classList.contains('wide'),gap=parseFloat(getComputedStyle(pb).rowGap)||0;
    var tall=wide?Math.max(dl.offsetHeight,lf.offsetHeight):dl.offsetHeight+lf.offsetHeight+gap;
    return h.scrollWidth>h.clientWidth+1||tall>pb.clientHeight+1||dl.scrollWidth>dl.clientWidth+1||lf.scrollWidth>lf.clientWidth+1||e.scrollWidth>e.clientWidth+1;});};
  for(var i=0;i<30&&over()&&k>.25;i++){k*=.94;box.style.setProperty('--k',k.toFixed(3));}}
window.addEventListener('resize',function(){if(view==='board')drawBoard();});
function tick(){if(view!=='board')return;var now=new Date(),c=$('#bclock');
  if(c)c.innerHTML=pad(now.getHours())+':'+pad(now.getMinutes())+'<small>'+pad(now.getSeconds())+'</small>';
  var d=$('#bdate');if(d)d.textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(todayISO(now)!==tick.day){tick.day=todayISO(now);drawBoard();}
  document.querySelectorAll('#board .paper').forEach(function(el){var p=S.papers.filter(function(x){return x.id===el.dataset.id;})[0];if(!p)return;var s=status(p,now);
    el.className='paper st-'+s.k;var tag=el.querySelector('[data-r=tag]'),lab=el.querySelector('[data-r=lab]'),left=el.querySelector('[data-r=left]'),bar=el.querySelector('[data-r=bar]');
    if(!s.t){tag.textContent='Set start time';lab.textContent='Time left';left.textContent='–';bar.style.width='0';return;}
    if(s.k==='wait'){tag.textContent='Not started';lab.textContent='Starts in';left.textContent=dur(s.t.st-now);bar.style.width='0';}
    else if(s.k==='end'){tag.textContent='Time is up';lab.textContent='Stop writing';left.textContent='0:00';bar.style.width='100%';}
    else{tag.textContent=s.k==='warn'?'Five minutes':'In progress';lab.textContent='Time left';left.textContent=dur(s.t.fin-now);bar.style.width=(100*(now-s.t.st)/(s.t.fin-s.t.st)).toFixed(2)+'%';}});}
setInterval(tick,1000);
/* ---------- set up ---------- */
function statusPill(p){var s=status(p,new Date());return '<span class="pill '+({run:'run',warn:'warn',end:'end'}[s.k]||'')+'">'+({wait:'Not started',run:'In progress',warn:'Five minutes',end:'Finished'}[s.k])+'</span>';}
function drawSetup(){var ps=todays(),old=S.papers.filter(function(p){return p.date!==todayISO();});
  $('#setup').innerHTML='<div class="wrap"><div class="stop"><h1>Exam Display<small>'+esc(new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+' · version '+VERSION+'</small></h1>'+
   '<button class="btn pri big" data-act="board">▶ Show on board</button></div>'+
   '<section class="card"><h2>📝 Papers in this room today<span class="sp"></span><button class="btn pri" data-act="add">+ Add a paper</button></h2>'+
   (ps.length?'<div class="plist">'+ps.map(function(p){var t=times(p);return '<div class="pitem"><div class="pi"><b>'+esc(p.name)+' <small class="muted">'+esc(p.level||'')+'</small></b><span>'+esc(code(p))+' · '+esc(p.dur)+' min · '+(t?hm(t.st)+'–'+hm(t.fin)+' · 5-min warning '+hm(t.warn):'no start time')+'</span></div>'+statusPill(p)+
     '<button class="btn sm" data-act="startnow" data-id="'+p.id+'" title="Set the start time to this minute">Start now</button><button class="btn sm" data-act="edit" data-id="'+p.id+'">Edit</button><button class="btn sm danger" data-act="del" data-id="'+p.id+'">Remove</button></div>';}).join('')+'</div>'+
     '<p class="note">Up to 4 papers show side by side. For candidates with extra time, add the same paper again with the longer duration.</p>':'<p class="muted">No papers yet. Add each paper being written in this room today.</p>')+
   (old.length?'<p class="note">'+old.length+' paper'+(old.length>1?'s':'')+' from other days are kept. <button class="btn sm" data-act="clearold">Remove them</button></p>':'')+'</section>'+
   '<section class="card"><h2>🏫 Centre</h2><div class="grid"><label class="f">School name<input class="in" data-f="school" value="'+esc(S.school)+'" placeholder="e.g. Lusaka Oaktree School"></label>'+
   '<label class="f">Cambridge centre number<input class="in" data-f="centre" value="'+esc(S.centre)+'" placeholder="e.g. ZM123"></label><label class="f">Room<input class="in" data-f="room" value="'+esc(S.room)+'" placeholder="e.g. Hall A"></label>'+
   '<div class="f"><span style="font-size:14px;color:#5b6b85;font-weight:600">School logo</span><div class="row">'+(S.logo?'<img class="logoprev" src="'+esc(S.logo)+'" alt="Logo">':'')+'<label class="btn sm">Choose picture<input type="file" accept="image/*" data-f="logo" hidden></label>'+(S.logo?'<button class="btn sm danger" data-act="nologo">Remove</button>':'')+'</div></div></div></section>'+
   '<section class="card"><h2>⚠️ Exam rules notice<span class="sp"></span><label class="row" style="font-size:15px;font-weight:500"><input type="checkbox" data-f="showRules"'+(S.showRules?' checked':'')+'> Show on the board</label></h2>'+
   '<textarea class="in" data-f="rules" aria-label="Rules, one per line">'+esc(S.rules)+'</textarea><p class="note">One rule per line. <button class="btn sm" data-act="rulesdef">Use the standard rules</button></p></section>'+
   '<section class="card"><h2>📚 Subjects and syllabus codes<span class="sp"></span><input class="in" data-f="sq" placeholder="Search" style="max-width:240px"><button class="btn sm" data-act="addsub">+ Add subject</button></h2>'+
   '<div class="subjects"><table><thead><tr><th style="width:150px">Level</th><th style="width:120px">Code</th><th>Subject</th><th style="width:60px"></th></tr></thead><tbody id="subrows">'+subRows('')+'</tbody></table></div>'+
   '<p class="note">'+S.subjects.length+' subjects. Change any code or name here and it is used when you add papers. <button class="btn sm" data-act="resetsubs">Restore the Cambridge list</button></p></section></div>';}
function subRows(q){q=(q||'').toLowerCase();return S.subjects.filter(function(s){return !q||(s.name+' '+s.code+' '+s.level).toLowerCase().indexOf(q)>=0;}).map(function(s){
  return '<tr data-id="'+s.id+'"><td><input class="in" data-s="level" value="'+esc(s.level)+'"></td><td><input class="in" data-s="code" value="'+esc(s.code)+'"></td><td><input class="in" data-s="name" value="'+esc(s.name)+'"></td><td><button class="btn sm danger" data-act="delsub" aria-label="Remove">✕</button></td></tr>';}).join('');}
/* ---------- add / edit a paper ---------- */
var ED=null;
function openPaper(p){ED=p?JSON.parse(JSON.stringify(p)):{id:uid(),date:todayISO(),level:'',code:'',name:'',comp:'',dur:90,start:''};
  if(!p){var now=new Date();now.setMinutes(Math.ceil((now.getMinutes()+1)/5)*5,0,0);ED.start=hm(now);}
  var levels=[];S.subjects.forEach(function(s){if(levels.indexOf(s.level)<0)levels.push(s.level);});
  $('#dlg').innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Paper"><h3>'+(p?'Edit paper':'Add a paper')+'</h3>'+
   '<div class="grid"><label class="f">Level<select class="in" data-e="levelf"><option value="">All levels</option>'+levels.map(function(l){return '<option'+(l===ED.level?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select></label>'+
   '<label class="f">Subject<select class="in" data-e="subject"></select></label></div>'+
   '<div class="grid" style="margin-top:12px"><label class="f">Name on the board<input class="in" data-e="name" value="'+esc(ED.name)+'"></label><label class="f">Syllabus code<input class="in" data-e="code" value="'+esc(ED.code)+'" inputmode="numeric"></label>'+
   '<label class="f">Component (paper) code<input class="in" data-e="comp" value="'+esc(ED.comp)+'" placeholder="e.g. 42" inputmode="numeric"><div class="sugg">'+['11','12','13','21','22','23','31','32','33','41','42','43','51','52','61','62'].map(function(c){return '<button type="button" data-act="comp" data-v="'+c+'">'+c+'</button>';}).join('')+'</div></label></div>'+
   '<div class="grid" style="margin-top:12px"><label class="f">Duration (minutes)<input class="in" type="number" min="5" max="600" step="5" data-e="dur" value="'+esc(ED.dur)+'"><div class="sugg">'+[45,60,75,90,105,120,135,150,180].map(function(m){return '<button type="button" data-act="dur" data-v="'+m+'">'+m+'</button>';}).join('')+'</div></label>'+
   '<label class="f">Start time<input class="in" type="time" data-e="start" value="'+esc(ED.start)+'"></label><label class="f">Date<input class="in" type="date" data-e="date" value="'+esc(ED.date)+'"></label></div>'+
   '<div class="calc" id="calc" style="margin-top:14px"></div>'+
   '<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="cancel">Cancel</button><button class="btn pri" data-act="savepaper">Save</button></div></div>';
  $('#dlg').hidden=false;fillSubjects();calc();}
function fillSubjects(){var lf=$('[data-e=levelf]').value,sel=$('[data-e=subject]');
  var list=S.subjects.filter(function(s){return !lf||s.level===lf;}).slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var cur=S.subjects.filter(function(s){return s.code===ED.code&&s.level===ED.level;})[0];
  sel.innerHTML='<option value="">Choose…</option>'+list.map(function(s){return '<option value="'+s.id+'"'+(cur&&cur.id===s.id?' selected':'')+'>'+esc(s.name+' ('+s.code+')'+(lf?'':' · '+s.level))+'</option>';}).join('');}
function calc(){var t=times(ED);$('#calc').innerHTML=t?'<span>Finish <b>'+hm(t.fin)+'</b></span><span>Five-minute warning <b>'+hm(t.warn)+'</b></span><span>Shows as <b>'+esc(code(ED)||'–')+'</b></span>':'<span class="muted">Enter a start time and duration to work out the finish and warning times.</span>';}
function readEd(){['name','code','comp','start','date'].forEach(function(k){var e=$('[data-e='+k+']');if(e)ED[k]=e.value.trim();});ED.dur=parseInt($('[data-e=dur]').value,10)||0;}
/* ---------- events ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;
  if(a==='board')showBoard();else if(a==='setup')showSetup();
  else if(a==='add')openPaper(null);
  else if(a==='edit')openPaper(S.papers.filter(function(p){return p.id===id;})[0]);
  else if(a==='del'){var p=S.papers.filter(function(x){return x.id===id;})[0];if(p&&confirm('Remove '+p.name+' '+code(p)+'?')){S.papers=S.papers.filter(function(x){return x.id!==id;});save();drawSetup();}}
  else if(a==='startnow'){var q=S.papers.filter(function(x){return x.id===id;})[0];if(q){q.start=hm(new Date());q.date=todayISO();save();drawSetup();toast(q.name+' starts now: '+q.start);}}
  else if(a==='clearold'){S.papers=S.papers.filter(function(p){return p.date===todayISO();});save();drawSetup();}
  else if(a==='nologo'){S.logo='';save();drawSetup();}
  else if(a==='rulesdef'){S.rules=RULES_DEF;save();drawSetup();}
  else if(a==='addsub'){S.subjects.unshift({id:uid(),level:'IGCSE',code:'',name:'New subject'});save();$('#subrows').innerHTML=subRows('');var f=document.querySelector('#subrows [data-s=name]');if(f){f.focus();f.select();}}
  else if(a==='delsub'){var tr=b.closest('tr');S.subjects=S.subjects.filter(function(s){return s.id!==tr.dataset.id;});save();tr.remove();}
  else if(a==='resetsubs'){if(confirm('Replace your subject list with the standard Cambridge list? Changes you made to the list will be lost.')){S.subjects=CAMBRIDGE.map(function(x,i){return {id:'c'+i,level:x[0],code:x[1],name:x[2]};});save();drawSetup();}}
  else if(a==='comp'){$('[data-e=comp]').value=b.dataset.v;readEd();calc();}
  else if(a==='dur'){$('[data-e=dur]').value=b.dataset.v;readEd();calc();}
  else if(a==='cancel'){$('#dlg').hidden=true;ED=null;}
  else if(a==='savepaper'){readEd();if(!ED.name||!ED.code){toast('Choose a subject, or type its name and syllabus code');return;}if(!(ED.dur>0)){toast('Enter the duration in minutes');return;}if(!/^\d{1,2}:\d{2}$/.test(ED.start)){toast('Enter the start time');return;}
    var i=S.papers.map(function(p){return p.id;}).indexOf(ED.id);if(i>=0)S.papers[i]=ED;else S.papers.push(ED);
    if(todays().length>4&&i<0)toast('More than 4 papers today: the board will show them smaller');save();$('#dlg').hidden=true;ED=null;drawSetup();}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.f==='logo'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){shrink(r.result,function(u){S.logo=u;save();drawSetup();});};r.readAsDataURL(t.files[0]);return;}
  if(t.dataset.f==='showRules'){S.showRules=t.checked;save();return;}
  if(t.dataset.e==='levelf'){fillSubjects();return;}
  if(t.dataset.e==='subject'){var s=S.subjects.filter(function(x){return x.id===t.value;})[0];if(s){ED.level=s.level;$('[data-e=name]').value=s.name;$('[data-e=code]').value=s.code;readEd();calc();}return;}
  if(t.dataset.e){readEd();calc();}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.dataset.f&&['school','centre','room','rules'].indexOf(t.dataset.f)>=0){S[t.dataset.f]=t.value;save();}
  else if(t.dataset.f==='sq'){$('#subrows').innerHTML=subRows(t.value);}
  else if(t.dataset.s){var tr=t.closest('tr'),s=S.subjects.filter(function(x){return x.id===tr.dataset.id;})[0];if(s){s[t.dataset.s]=t.value;save();}}
  else if(t.dataset.e&&ED){readEd();calc();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#dlg').hidden){$('#dlg').hidden=true;ED=null;}else if(view==='board')showSetup();}});
function shrink(url,cb){var im=new Image();im.onload=function(){var m=320,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'));};im.onerror=function(){toast('That picture could not be opened');};im.src=url;}
/* Android back button: board -> set up -> leave */
window.ITBack=function(){if(!$('#dlg').hidden){$('#dlg').hidden=true;ED=null;return true;}if(view==='board'){showSetup();return true;}return false;};
load();if(todays().length)showBoard();else showSetup();
</script>
</body>
</html>
