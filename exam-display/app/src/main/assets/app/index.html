<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Display</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-tap-highlight-color:transparent}
body{background:#0d1b33;font-family:'ED Inter',"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
</style>
<style id="bcss">
/* ================= BOARD (all sizes in --u, so it is sharp and in proportion on HD and 4K) ================= */
.bd{--u:10px;--k:1;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:calc(var(--u)*1.1);padding:calc(var(--u)*1.5) calc(var(--u)*1.9) calc(var(--u)*1.2);
  color:var(--fg);font-family:var(--font);background-color:var(--bg);background-image:radial-gradient(calc(var(--u)*90) calc(var(--u)*45) at 8% -12%,var(--glow1),transparent 62%),radial-gradient(calc(var(--u)*80) calc(var(--u)*50) at 102% 112%,var(--glow2),transparent 60%)}
#board{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5}
.bd .num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums}
.bhead{display:flex;align-items:center;gap:calc(var(--u)*1.3);flex:none}
.blogo{height:calc(var(--u)*6.6);max-width:calc(var(--u)*14);object-fit:contain;border-radius:calc(var(--u)*.6);flex:none}
.blogo.pad{background:#fff;padding:calc(var(--u)*.45)}
.blogo.wide{max-width:calc(var(--u)*30);height:calc(var(--u)*5.6)}
.bschool{flex:1;min-width:0}
.bschool h1{margin:0;font-size:calc(var(--u)*2.6);line-height:1.12;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bschool p{margin:calc(var(--u)*.35) 0 0;font-size:calc(var(--u)*1.45);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bschool p b{color:var(--fg);font-weight:600}
.bclock{text-align:right;flex:none}
.bclock .t{font-weight:800;font-size:calc(var(--u)*6.2);line-height:1;letter-spacing:-.02em}
.bclock .t small{font-size:.42em;color:var(--muted);margin-left:.12em;font-weight:600}
.bclock .d{font-size:calc(var(--u)*1.4);color:var(--muted);margin-top:calc(var(--u)*.35)}
.bmain{flex:1;min-height:0;display:flex;gap:calc(var(--u)*1.2)}
.bpapers{flex:1;min-width:0;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;overflow:hidden}
.bpapers>.paper{flex:none}
/* a paper card */
.paper{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border-radius:calc(var(--u)*1.4);
  padding:calc(var(--u)*1.4*var(--k)) calc(var(--u)*1.8*var(--k)) calc(var(--u)*1.6*var(--k));background:var(--panel);border:calc(var(--u)*.14) solid var(--line);box-shadow:var(--shadow);transition:background .6s,border-color .6s}
.paper header{display:flex;align-items:flex-start;gap:calc(var(--u)*1)}
.paper .ttl{flex:1;min-width:0}
.paper .subj{margin:0;font-size:calc(var(--u)*4.4*var(--k));font-weight:800;line-height:1.06;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.paper .pline{margin:calc(var(--u)*.25*var(--k)) 0 0;font-size:calc(var(--u)*2.5*var(--k));font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .lvl{margin:calc(var(--u)*.2*var(--k)) 0 0;font-size:calc(var(--u)*1.7*var(--k));color:var(--muted)}
.paper .tag{flex:none;font-size:calc(var(--u)*1.55*var(--k));font-weight:800;padding:.35em .9em;border-radius:999px;background:var(--chip);color:var(--fg);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.paper .pbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--u)*1.2*var(--k));margin-top:calc(var(--u)*1*var(--k))}
.paper dl{display:table;border-collapse:collapse;margin:auto 0;font-size:calc(var(--u)*3.1*var(--k));line-height:1.15}
.paper .dr{display:table-row}
.paper dt,.paper dd{display:table-cell;padding:calc(var(--u)*.375*var(--k)) 0;vertical-align:baseline}
.paper dt{color:var(--muted);white-space:nowrap;font-weight:500;padding-right:calc(var(--u)*1.8*var(--k))}
.paper dd{margin:0;font-weight:800;white-space:nowrap}
.paper .left{display:flex;align-items:baseline;justify-content:space-between;gap:calc(var(--u)*1);border-top:calc(var(--u)*.14) solid var(--line);padding-top:calc(var(--u)*.9*var(--k))}
.paper .left span{font-size:calc(var(--u)*1.9*var(--k));color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.paper .left b{font-size:calc(var(--u)*6.4*var(--k));line-height:1;font-weight:800;color:var(--timer)}
.paper .bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*.5);background:var(--chip)}
.paper .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width 1s linear}
/* states (same meaning in every design: amber = five minutes, red = time is up) */
.paper.st-wait .left b{color:var(--muted)}
.paper.st-run{border-color:var(--acc)}
.paper.st-run .tag{background:var(--acc);color:var(--accfg)}
.paper.st-warn{background:var(--warnbg);border-color:#f59e0b}
.paper.st-warn .tag{background:#f59e0b;color:#2a1800}
.paper.st-warn .left b,.paper.st-warn .left span{color:var(--warnfg)}
.paper.st-warn .bar i{background:#f59e0b}
.paper.st-end{background:var(--endbg);border-color:#ef4444}
.paper.st-end .tag{background:#ef4444;color:#fff}
.paper.st-end .left b,.paper.st-end .left span{color:var(--endfg)}
.paper.st-end .bar i{background:#ef4444}
/* layout: panels (details beside the timer when there is room) */
.L-panels.wide .paper .pbody{flex-direction:row;align-items:center}
.L-panels.wide .paper dl{flex:1;margin:0}
.L-panels.wide .paper .left{flex-direction:column;align-items:center;justify-content:center;border-top:0;border-left:calc(var(--u)*.14) solid var(--line);padding:0 0 0 calc(var(--u)*2.4*var(--k));align-self:stretch;gap:calc(var(--u)*1*var(--k))}
.L-panels.wide .paper .left b{font-size:calc(var(--u)*8.4*var(--k))}
/* layout: big countdown */
.L-count .paper .pbody{justify-content:center;align-items:center;text-align:center}
.L-count .paper .left{flex-direction:column;align-items:center;border:0;padding:0;gap:calc(var(--u)*.6*var(--k))}
.L-count .paper .left b{font-size:calc(var(--u)*15*var(--k));letter-spacing:-.03em}
.L-count .paper .left span{font-size:calc(var(--u)*2.4*var(--k))}
.L-count .paper dl{display:flex;flex-wrap:wrap;justify-content:center;margin:0;font-size:calc(var(--u)*2.7*var(--k))}
.L-count .paper .dr{display:block;white-space:nowrap;margin:calc(var(--u)*.3*var(--k)) calc(var(--u)*1.1*var(--k))}
.L-count .paper dt,.L-count .paper dd{display:inline;padding:0}
.L-count .paper dd{margin-left:.45em}
.L-count .paper .ttl{text-align:center}
.L-plain .paper,.L-plain .paper.st-warn,.L-plain .paper.st-end,.L-plain .paper.st-run{background:transparent;border:0;border-top:calc(var(--u)*.3) solid var(--fg);border-radius:0;box-shadow:none;padding-left:0;padding-right:0}
.L-plain .paper.st-warn{border-top-color:#f59e0b}.L-plain .paper.st-end{border-top-color:#ef4444}
.L-plain .paper .bar{display:none}
.L-plain .paper .left{border-top:calc(var(--u)*.12) solid var(--line)}
.L-plain.wide .paper .pbody{flex-direction:row;align-items:center}
.L-plain.wide .paper dl{flex:1;margin:0}
.L-plain.wide .paper .left{flex-direction:column;align-items:flex-end;justify-content:center;border-top:0;padding:0;align-self:stretch}
.L-plain.wide .paper .left b{font-size:calc(var(--u)*8.4*var(--k))}
.bd.plain .bhead{border-bottom:calc(var(--u)*.14) solid var(--line);padding-bottom:calc(var(--u)*1)}
.bd.plain .brules{background:transparent;border:0;border-top:calc(var(--u)*.14) solid var(--line);border-radius:0;padding-left:0;padding-right:0}
.bd.flat .paper,.bd.flat .ttab,.bd.flat .bside{box-shadow:none}
/* layout: table */
.ttab{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:calc(var(--u)*1.4);overflow:hidden;border:calc(var(--u)*.14) solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.trow{display:flex;align-items:center;padding:calc(var(--u)*.9*var(--k)) calc(var(--u)*1.6*var(--k));border-top:calc(var(--u)*.12) solid var(--line);font-size:calc(var(--u)*2.7*var(--k));position:relative;flex:1;min-height:0;transition:background .6s}
.trow>*{flex:1 1 0px;min-width:0;margin-right:calc(var(--u)*1*var(--k))}.trow>*:last-child{margin-right:0}
.trow>:nth-child(1){flex-grow:3.2}.trow>:nth-child(2){flex-grow:1.1}.trow>:nth-child(3){flex-grow:1.3}.trow>:nth-child(4){flex-grow:1.2}.trow>:nth-child(7){flex-grow:1.25}.trow>:nth-child(8){flex-grow:1.7}
.trow.th{flex:none;border-top:0;background:var(--chip);font-size:calc(var(--u)*1.75*var(--k));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.trow .c1{min-width:0}
.trow .c1 b{display:block;font-size:1.3em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .c1 small{display:block;color:var(--acc);font-weight:600;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .v{font-weight:800;white-space:nowrap}
.trow .tl{text-align:right;font-weight:800;font-size:1.6em;color:var(--timer);white-space:nowrap}
.trow .tl small{display:block;font-size:.42em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font)}
.trow.st-warn{background:var(--warnbg)}.trow.st-warn .tl{color:var(--warnfg)}
.trow.st-end{background:var(--endbg)}.trow.st-end .tl{color:var(--endfg)}
.trow.st-wait .tl{color:var(--muted)}
/* layout: clock at the side */
.bside{flex:none;width:calc(var(--u)*30);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);text-align:center;border-radius:calc(var(--u)*1.4);background:var(--panel);border:calc(var(--u)*.14) solid var(--line);box-shadow:var(--shadow);padding:calc(var(--u)*2)}
.bside .logos{display:flex;gap:calc(var(--u)*1.2);align-items:center;justify-content:center;flex-wrap:wrap}
.bside .blogo{height:calc(var(--u)*11);max-width:calc(var(--u)*12.5)}
.bside h1{margin:0;font-size:calc(var(--u)*2.3);font-weight:800;line-height:1.15}
.bside p{margin:0;color:var(--muted);font-size:calc(var(--u)*1.4)}
.bside .t{font-weight:800;font-size:calc(var(--u)*8.4);line-height:1;letter-spacing:-.03em}
.bside .t small{font-size:.4em;color:var(--muted)}
.bside .d{font-size:calc(var(--u)*1.5);color:var(--muted)}
/* empty, rules, menu */
.bempty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*1);border:calc(var(--u)*.2) dashed var(--line);border-radius:calc(var(--u)*1.4);color:var(--muted);font-size:calc(var(--u)*1.9);text-align:center;flex:1}
.bempty svg{width:calc(var(--u)*6);height:calc(var(--u)*6)}
.brules{flex:none;display:flex;gap:calc(var(--u)*1.2);align-items:center;padding:calc(var(--u)*.85) calc(var(--u)*1.4);border-radius:calc(var(--u)*1);background:var(--chip);border:calc(var(--u)*.12) solid var(--line);font-size:calc(var(--u)*1.45)}
.brules ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4) calc(var(--u)*2.2)}
.brules li::before{content:"•";color:#f59e0b;margin-right:.5em}
.brules svg{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);flex:none}
#bmenu{position:fixed;right:12px;bottom:12px;z-index:20;display:flex;gap:8px;align-items:center;flex-direction:row-reverse}
#bmenu .fab{width:52px;height:52px;border-radius:50%;border:0;background:rgba(127,127,127,.18);color:inherit;cursor:pointer;opacity:.35;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
#bmenu .fab:hover,#bmenu .fab:focus,#bmenu.open .fab{opacity:1}
#bmenu .items{display:none;gap:8px;background:rgba(15,23,42,.94);padding:8px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#bmenu.open .items{display:flex}
#bmenu .items button{border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;white-space:nowrap}
#bmenu .items button:hover{background:rgba(255,255,255,.2)}
/* older board browsers without flex gap */
.nogap .bd>*+*{margin-top:calc(var(--u)*1.1)}
.nogap .bhead>*+*,.nogap .bmain>*+*,.nogap .brules>*+*{margin-left:calc(var(--u)*1.2)}
.nogap .paper header>*+*{margin-left:calc(var(--u)*1)}
.nogap .paper .pbody>*+*{margin-top:calc(var(--u)*1.2*var(--k))}
.nogap .L-panels.wide .paper .pbody>*+*,.nogap .L-plain.wide .paper .pbody>*+*{margin-top:0;margin-left:calc(var(--u)*1.6*var(--k))}
.nogap .bside>*+*{margin-top:calc(var(--u)*1.6)}
.nogap .brules li{margin-right:calc(var(--u)*2.2)}
.nogap .row>*,.nogap .toggles>*,.nogap .sugg>*{margin:0 8px 8px 0}
.nogap #bmenu .items button{margin-left:8px}
</style>
<style>
/* ================= SETTINGS ================= */
#setup{min-height:100%;background:#eef2f8;color:#14213d}
.stop{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f2;box-shadow:0 2px 12px -6px rgba(16,30,54,.2)}
.stop .in1{max-width:1280px;margin:0 auto;padding:12px clamp(12px,3vw,32px) 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop h1{margin:0;font-size:24px;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stop h1 small{font-size:13px;color:#5b6b85;font-weight:500}
.tabs{max-width:1280px;margin:0 auto;padding:6px clamp(12px,3vw,32px) 0;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 16px;font-size:16px;font-weight:600;color:#5b6b85;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:#1d4ed8;border-bottom-color:#2563eb}
.tabs svg{width:18px;height:18px}
.spage{max-width:1280px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 80px}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px -12px rgba(16,30,54,.18);border:1px solid #e2e8f2}
.card h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:#5b6b85;font-weight:600}
.in{border:1px solid #cdd6e4;border-radius:10px;padding:10px 12px;font-size:17px;background:#fff;color:#14213d;min-height:46px;width:100%}
.in:focus{outline:0;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
textarea.in{min-height:140px;resize:vertical;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #cdd6e4;background:linear-gradient(#fff,#f3f6fb);border-radius:10px;padding:10px 16px;font-size:16px;font-weight:600;color:#14213d;cursor:pointer;min-height:46px;box-shadow:0 1px 2px rgba(16,30,54,.08);white-space:nowrap}
.btn:hover{border-color:#9fb0cc}
.btn.pri{background:linear-gradient(#4b8ef7,#2563eb);color:#fff;border-color:#1d4ed8;box-shadow:0 4px 14px -4px rgba(37,99,235,.6)}
.btn.big{font-size:18px;padding:12px 22px;min-height:52px}
.btn.danger{color:#b91c1c}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;gap:14px;align-items:center;border:1px solid #e2e8f2;border-radius:12px;padding:12px 14px;background:#f8fafd;flex-wrap:wrap}
.pitem .pi{flex:1;min-width:220px}
.pitem .pi b{font-size:18px;display:block}
.pitem .pi em{font-style:normal;color:#1d4ed8;font-weight:600;display:block}
.pitem .pi span{color:#5b6b85;font-size:14px;font-family:'ED Mono',monospace}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#e2e8f2;color:#334155}
.pill.run{background:#dbeafe;color:#1d4ed8}.pill.warn{background:#fef3c7;color:#92400e}.pill.end{background:#fee2e2;color:#b91c1c}
.muted{color:#5b6b85}.note{font-size:13px;color:#5b6b85}
.calc{display:flex;gap:18px;flex-wrap:wrap;background:#f1f5fb;border-radius:10px;padding:10px 14px;font-size:15px}
.calc b{font-family:'ED Mono',monospace;font-size:18px}
.subjects{max-height:520px;overflow:auto;border:1px solid #e2e8f2;border-radius:12px}
.subjects table{width:100%;border-collapse:collapse;font-size:15px}
.subjects th{position:sticky;top:0;background:#f1f5fb;text-align:left;padding:8px 10px;font-size:13px;color:#5b6b85;z-index:1}
.subjects td{padding:6px 10px;border-top:1px solid #eef2f8}
.subjects td .in{min-height:38px;padding:6px 8px;font-size:15px}
.logobox{display:flex;gap:14px;align-items:center;border:1px dashed #cdd6e4;border-radius:12px;padding:12px;min-height:110px}
.logobox img{height:84px;max-width:200px;object-fit:contain;border-radius:8px;background:repeating-conic-gradient(#eef2f8 0 25%,#fff 0 50%) 0 0/16px 16px;padding:4px}
.logobox .ph{height:84px;width:84px;flex:none;border-radius:8px;background:#f1f5fb;display:flex;align-items:center;justify-content:center;color:#9fb0cc;font-size:13px;text-align:center}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.choice{border:2px solid #e2e8f2;border-radius:14px;padding:10px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;color:#14213d}
.choice[aria-pressed="true"]{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.choice b{font-size:15px}.choice small{color:#5b6b85;font-size:12px}
.swatch{height:64px;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end;gap:6px;padding:8px;border:1px solid rgba(0,0,0,.08)}
.swatch i{display:block;height:14px;border-radius:4px}
.fontsample{font-size:26px;line-height:1.1;font-weight:800}
.fontsample span{display:block;font-size:14px;font-weight:400;margin-top:4px}
.lay svg{width:100%;height:auto;border-radius:8px;display:block}
.toggles{display:flex;flex-wrap:wrap;gap:10px 24px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:16px;cursor:pointer}
.toggles input{width:20px;height:20px}
.preview{position:relative;width:100%;height:0;padding-top:56.25%;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);background:#000}
.preview .bd{position:absolute;left:0;top:0;transform-origin:0 0}
.colors{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.colors label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5b6b85;font-weight:600}
.colors input[type=color]{width:70px;height:44px;border:1px solid #cdd6e4;border-radius:10px;padding:2px;background:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg button{border:1px solid #cdd6e4;background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
#dlg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#dlg .box{background:#fff;color:#14213d;border-radius:18px;width:min(820px,100%);max-height:94vh;overflow:auto;padding:20px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}

  else if(k==='table')s=hd+'<rect x="8" y="20" width="144" height="56" rx="4" fill="#1e3a6e"/>'+[26,38,50,62].map(function(y,i){return '<rect x="8" y="'+(y+8)+'" width="144" height="0.6" fill="#2b3f63"/>'+l(12,y,30)+l(50,y,14)+l(70,y,14)+l(90,y,14)+(i?'<rect x="124" y="'+(y-2)+'" width="24" height="6" rx="2" fill="#93c5fd"/>':'');}).join('')+ft;
  else s=p(8,7,44,69)+'<circle cx="22" cy="20" r="5" fill="#fff"/><circle cx="38" cy="20" r="5" fill="#fff"/><rect x="14" y="44" width="32" height="10" rx="2" fill="#fff"/>'+p(56,7,96,32)+p(56,43,96,33)+l(62,14,40)+l(62,20,30)+big(112,20,34)+l(62,50,40)+l(62,56,30)+big(112,56,34)+ft;
  return '<svg viewBox="0 0 160 90">'+b+s+'</svg>';}
function sample(){var d=todayISO(),now=nowD(),m=function(off){return hm(new Date(now.getTime()+off*60000));};
  return [{id:'s1',date:d,name:'Biology',line:'Paper 4 – Theory (Extended)',level:'IGCSE',code:'0610',comp:'42',dur:75,start:m(-30)},{id:'s2',date:d,name:'Chemistry',line:'Paper 2 – AS Level Structured Questions',level:'AS & A Level',code:'9701',comp:'22',dur:75,start:m(-71)}];}
function drawPreview(){var pv=$('#pv');if(!pv)return;var W=1920,H=1080,ps=todays();if(!ps.length)ps=sample();
  pv.innerHTML='<div class="bd"></div>';var el=$('.bd',pv);drawBoard(el,ps,W,H);el.style.transform='scale('+(pv.clientWidth/W)+')';}
function subRows(q){q=(q||'').toLowerCase();return S.subjects.filter(function(s){return !q||(s.name+' '+s.code+' '+s.level).toLowerCase().indexOf(q)>=0;}).map(function(s){
  return '<tr data-id="'+s.id+'"><td><input class="in" data-s="level" value="'+esc(s.level)+'"></td><td><input class="in" data-s="code" value="'+esc(s.code)+'"></td><td><input class="in" data-s="name" value="'+esc(s.name)+'"></td><td><button class="btn sm danger" data-act="delsub" aria-label="Remove">✕</button></td></tr>';}).join('');}
/* ---------- add / edit a paper ---------- */
var ED=null;
function openPaper(p,copy){ED=p?JSON.parse(JSON.stringify(p)):{id:uid(),date:todayISO(),level:'',code:'',name:'',line:'',comp:'',dur:90,start:''};if(copy){ED.id=uid();if(!/extra time/i.test(ED.line||''))ED.line=(ED.line?ED.line+' ':'')+'(extra time)';}
  if(!p){var now=nowD();now.setMinutes(Math.ceil((now.getMinutes()+1)/5)*5,0,0);ED.start=hm(now);}
  var levels=[];S.subjects.forEach(function(s){if(levels.indexOf(s.level)<0)levels.push(s.level);});
  $('#dlg').innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Paper"><h3>'+(copy?'Copy paper':p?'Edit paper':'Add a paper')+'</h3>'+
   '<div class="grid"><label class="f">Level<select class="in" data-e="levelf"><option value="">All levels</option>'+levels.map(function(l){return '<option'+(l===ED.level?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select></label>'+
   '<label class="f">Subject<select class="in" data-e="subject"></select></label></div>'+
   '<div class="grid" style="margin-top:12px"><label class="f">Subject name on the board<input class="in" data-e="name" value="'+esc(ED.name)+'"></label><label class="f">Syllabus code<input class="in" data-e="code" value="'+esc(ED.code)+'" inputmode="numeric"></label>'+
   '<label class="f">Component (paper) code<input class="in" data-e="comp" value="'+esc(ED.comp)+'" placeholder="e.g. 42" inputmode="numeric"><div class="sugg" id="compchips"></div></label></div>'+
   '<label class="f" style="margin-top:12px">Paper line under the subject<input class="in" data-e="line" value="'+esc(ED.line)+'" placeholder="e.g. Paper 1 – Multiple Choice"><div class="sugg">'+['Paper 1','Paper 2','Paper 3','Paper 4','Paper 5','Paper 6','Multiple Choice (Core)','Multiple Choice (Extended)','Theory (Core)','Theory (Extended)','Practical Test','Alternative to Practical'].map(function(c){return '<button type="button" data-act="line" data-v="'+c+'">'+c+'</button>';}).join('')+'</div></label>'+
   '<div class="grid" style="margin-top:12px"><label class="f">Duration (minutes)<input class="in" type="number" min="5" max="600" step="5" data-e="dur" value="'+esc(ED.dur)+'"><div class="sugg">'+[45,60,75,90,105,120,135,150,180].map(function(m){return '<button type="button" data-act="dur" data-v="'+m+'">'+m+'</button>';}).join('')+'</div></label>'+
   '<label class="f">Start time<input class="in" type="time" data-e="start" value="'+esc(ED.start)+'"></label><label class="f">Date<input class="in" type="date" data-e="date" value="'+esc(ED.date)+'"></label></div>'+
   '<div class="calc" id="calc" style="margin-top:14px"></div>'+
   '<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="cancel">Cancel</button><button class="btn pri" data-act="savepaper">Save</button></div></div>';
  $('#dlg').hidden=false;fillSubjects();compChips();calc();}
function compChips(){var el=$('#compchips');if(!el)return;var t=COMPONENTS[ED.level+'|'+ED.code];
  el.innerHTML=t?Object.keys(t).map(function(c){return '<button type="button" data-act="comp" data-v="'+c+'">'+c+' '+esc(t[c][0])+'</button>';}).join(''):['11','12','13','21','22','23','31','32','33','41','42','43','51','52','61','62'].map(function(c){return '<button type="button" data-act="comp" data-v="'+c+'">'+c+'</button>';}).join('');}
function applyComp(){var ci=compInfo();if(!ci)return false;$('[data-e=line]').value=ci[0];$('[data-e=dur]').value=ci[1];return true;}
function fillSubjects(){var lf=$('[data-e=levelf]').value,sel=$('[data-e=subject]');
  var list=S.subjects.filter(function(s){return !lf||s.level===lf;}).slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var cur=S.subjects.filter(function(s){return s.code===ED.code&&s.level===ED.level;})[0];
  sel.innerHTML='<option value="">Choose…</option>'+list.map(function(s){return '<option value="'+s.id+'"'+(cur&&cur.id===s.id?' selected':'')+'>'+esc(s.name+' ('+s.code+')'+(lf?'':' · '+s.level))+'</option>';}).join('');}
function calc(){var t=times(ED);$('#calc').innerHTML=t?'<span>Finish <b>'+hm(t.fin)+'</b></span><span>Five-minute warning <b>'+hm(t.warn)+'</b></span><span>Shows as <b>'+esc(code(ED)||'–')+'</b></span>':'<span class="muted">Enter a start time and duration to work out the finish and warning times.</span>';}
function readEd(){['name','code','comp','start','date','line'].forEach(function(k){var e=$('[data-e='+k+']');if(e)ED[k]=e.value.trim();});ED.dur=parseInt($('[data-e=dur]').value,10)||0;}
function autoLine(comp){var ln=$('[data-e=line]'),cur=ln.value.trim(),m=/^Paper \d/.exec(cur),nl=paperLine(comp);if(!nl)return;if(!cur)ln.value=nl;else if(m)ln.value=nl+cur.slice(m[0].length);}
/* ---------- events ---------- */
function byId(id){return S.papers.filter(function(p){return p.id===id;})[0];}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b){if(view==='board'&&!e.target.closest('#bmenu'))$('#bmenu').classList.remove('open');return;}var a=b.dataset.act,id=b.dataset.id;
  if(a==='board')showBoard();
  else if(a==='setup')showSetup(b.dataset.tab);
  else if(a==='menu')$('#bmenu').classList.toggle('open');
  else if(a==='cycle'){var k=b.dataset.what,list=k==='theme'?THEMES.map(function(t){return t.id;}):LAYOUTS.map(function(l){return l[0];}),i=list.indexOf(S.look[k]);S.look[k]=list[(i+1)%list.length];save();drawBoard($('#board'),todays(),innerWidth,innerHeight);toast(k==='theme'?THEMES.filter(function(t){return t.id===S.look.theme;})[0].name:LAYOUTS.filter(function(l){return l[0]===S.look.layout;})[0][1]);}
  else if(a==='tab'){tab=b.dataset.tab;drawSetup();}
  else if(a==='look'){S.look[b.dataset.k]=b.dataset.v;save();var y=scrollY;drawTab();scrollTo(0,y);}
  else if(a==='add')openPaper(null);
  else if(a==='edit')openPaper(byId(id));
  else if(a==='dup')openPaper(byId(id),true);
  else if(a==='del'){var p=byId(id);if(p&&confirm('Remove '+p.name+' '+code(p)+'?')){S.papers=S.papers.filter(function(x){return x.id!==id;});save();drawTab();}}
  else if(a==='startnow'){var q=byId(id);if(q){q.start=hm(nowD());q.date=todayISO();save();drawTab();toast(q.name+' starts now: '+q.start);}}
  else if(a==='clearold'){var keep=todays(),td=todayISO();S.papers=S.papers.filter(function(p){return p.date>=td||keep.indexOf(p)>=0;});save();drawTab();}
  else if(a==='clkadj'){S.clockOff=(+S.clockOff||0)+(+b.dataset.v)*1000;save();var y=scrollY;drawTab();scrollTo(0,y);}
  else if(a==='clkset'){var dv=$('#clkd').value,tv=$('#clkt').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)||!/^\d{1,2}:\d{2}/.test(tv)){toast('Enter the correct date and time');return;}var tp=tv.split(':'),tgt=new Date(dv+'T00:00:00');tgt.setHours(+tp[0],+tp[1],+(tp[2]||0),0);S.clockOff=tgt.getTime()-Date.now();if(Math.abs(S.clockOff)<1500)S.clockOff=0;save();var y2=scrollY;drawTab();scrollTo(0,y2);toast('Clock set');}
  else if(a==='clkreset'){S.clockOff=0;save();drawTab();}
  else if(a==='builtin'){S[b.dataset.k]='builtin:'+b.dataset.v;save();drawTab();}
  else if(a==='nologo'){S[b.dataset.k]='';save();drawTab();}
  else if(a==='rulesdef'){S.rules=RULES_DEF;save();drawTab();}
  else if(a==='addsub'){S.subjects.unshift({id:uid(),level:'IGCSE',code:'',name:'New subject'});save();$('#subrows').innerHTML=subRows('');var f=$('#subrows [data-s=name]');if(f){f.focus();f.select();}}
  else if(a==='delsub'){var tr=b.closest('tr');S.subjects=S.subjects.filter(function(s){return s.id!==tr.dataset.id;});save();tr.remove();}
  else if(a==='resetsubs'){if(confirm('Replace your subject list with the standard Cambridge list? Changes you made to the list will be lost.')){S.subjects=CAMBRIDGE.map(function(x,i){return {id:'c'+i,level:x[0],code:x[1],name:x[2]};});save();drawTab();}}
  else if(a==='comp'){$('[data-e=comp]').value=b.dataset.v;readEd();if(!applyComp())autoLine(b.dataset.v);readEd();calc();}
  else if(a==='line'){var li=$('[data-e=line]'),v=b.dataset.v,cur=li.value.trim(),pm=/^Paper \d/.exec(cur);
    if(/^Paper \d$/.test(v))li.value=pm?v+cur.slice(pm[0].length):(cur?v+' – '+cur:v);else li.value=pm?pm[0]+' – '+v:v;readEd();}
  else if(a==='dur'){$('[data-e=dur]').value=b.dataset.v;readEd();calc();}
  else if(a==='cancel'){$('#dlg').hidden=true;ED=null;}
  else if(a==='savepaper'){readEd();if(!ED.name||!ED.code){toast('Choose a subject, or type its name and syllabus code');return;}if(!(ED.dur>0)){toast('Enter the duration in minutes');return;}if(!/^\d{1,2}:\d{2}$/.test(ED.start)){toast('Enter the start time');return;}
    var i2=S.papers.map(function(x){return x.id;}).indexOf(ED.id);if(i2>=0)S.papers[i2]=ED;else S.papers.push(ED);save();$('#dlg').hidden=true;ED=null;drawTab();}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.logo&&t.files&&t.files[0]){var k=t.dataset.logo,r=new FileReader();r.onload=function(){shrink(r.result,function(u){S[k]=u;save();drawTab();});};r.readAsDataURL(t.files[0]);return;}
  if(t.dataset.l){S.look[t.dataset.l]=t.checked;save();if(tab==='look')drawPreview();return;}
  if(t.dataset.c){S.look.custom[t.dataset.c]=t.value;save();var y=scrollY;drawTab();scrollTo(0,y);return;}
  if(t.dataset.e==='levelf'){fillSubjects();return;}
  if(t.dataset.e==='subject'){var s=S.subjects.filter(function(x){return x.id===t.value;})[0];if(s){ED.level=s.level;$('[data-e=name]').value=s.name;$('[data-e=code]').value=s.code;readEd();compChips();if(applyComp())readEd();calc();}return;}
  if(t.dataset.e){readEd();calc();}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.dataset.f&&['school','centre','room','rules'].indexOf(t.dataset.f)>=0){S[t.dataset.f]=t.value;save();}
  else if(t.dataset.f==='sq'){$('#subrows').innerHTML=subRows(t.value);}
  else if(t.dataset.s){var tr=t.closest('tr'),s=S.subjects.filter(function(x){return x.id===tr.dataset.id;})[0];if(s){s[t.dataset.s]=t.value;save();}}
  else if(t.dataset.e&&ED){if(t.dataset.e==='comp'){ED.comp=t.value.trim();if(!applyComp())autoLine(t.value);}readEd();if(t.dataset.e==='code')compChips();calc();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#dlg').hidden){$('#dlg').hidden=true;ED=null;}else if(view==='board'){if($('#bmenu').classList.contains('open'))$('#bmenu').classList.remove('open');else showSetup();}}});
/* logos are kept up to 900 px so they stay sharp on a 4K board */
function shrink(url,cb){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);var u=c.toDataURL('image/png');if(u.length>1400000)u=c.toDataURL('image/webp',.92);if(u.length>1400000||u.indexOf('data:image/webp')<0&&u.length>1400000)u=c.toDataURL('image/jpeg',.9);cb(u);};im.onerror=function(){toast('That picture could not be opened');};im.src=url;}
/* Android back button: menu -> board -> settings -> leave */
window.ITBack=function(){if(!$('#dlg').hidden){$('#dlg').hidden=true;ED=null;return true;}if(view==='board'){if($('#bmenu').classList.contains('open')){$('#bmenu').classList.remove('open');return true;}showSetup();return true;}return false;};
(function(){var f=document.createElement('div');f.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';f.appendChild(document.createElement('div'));f.appendChild(document.createElement('div'));document.body.appendChild(f);var ok=f.scrollHeight===1;f.remove();if(!ok)document.documentElement.classList.add('nogap');})();
function loadFonts(){if(!document.fonts||!document.fonts.load)return Promise.resolve();var l=[];FONTS.concat([['ED Mono']]).forEach(function(f){[400,600,800].forEach(function(w){l.push(document.fonts.load(w+' 40px "'+f[0]+'"').catch(function(){}));});});return Promise.all(l).then(function(){return document.fonts.ready;});}
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',function(){if(view==='board')drawBoard($('#board'),todays(),innerWidth,innerHeight);else if(tab==='look')drawPreview();});
load();
var booted=false;function boot(){if(booted)return;booted=true;if(todays().length)showBoard();else showSetup();}
loadFonts().then(boot,boot);setTimeout(boot,4000);
</script>
