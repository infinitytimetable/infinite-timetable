  return '<section class="card"><h2>Admin PIN</h2><p class="muted">'+(p?'A PIN is set. The app opens view-only until someone unlocks it.':'Set a PIN so the app opens view-only, for example on a staff-room PC.')+'</p><div class="row">'+(p?'<button class="btn" data-act="b6-lock">Lock now</button><button class="btn" data-act="b6-pin-change">Change PIN</button><button class="btn danger" data-act="b6-pin-remove">Remove PIN</button>':'<button class="btn primary" data-act="b6-pin-set">Set an admin PIN</button>')+'</div></section>';
}
function displayCard(){
  return '<section class="card"><h2>Live staff-room display</h2><p class="muted">Full-screen board for a TV or smart board: lessons now, cover, absent staff, today\'s events and room bookings. It updates by itself.</p><div class="row"><button class="btn primary" data-act="b6-display">Open the display</button><label class="row" style="gap:6px"><input type="checkbox" data-b6="pref" data-k="liveOnStart"'+(W.prefs.liveOnStart?' checked':'')+'> Open it when Infinity Timetable starts</label></div></section>';
}

/* --- actions --- */
function b6Action(a,ds,btn){
  if(a==='b6-file')fileMenu(btn);
  else if(a==='b6-new'){cmClose();fileNew();}
  else if(a==='b6-open'){cmClose();fileOpen();}
  else if(a==='b6-save'){cmClose();fileSave(false);}
  else if(a==='b6-saveas'){cmClose();fileSave(true);}
  else if(a==='b6-recent'){cmClose();fileOpenPath(ds.path);}
  else if(a==='b6-about'){cmClose();openAbout();}
  else if(a==='b6-whatsnew'){cmClose();openWhatsNew();}
  else if(a==='b6-xlsx-menu'){cmClose();openXlsxMenu();}
  else if(a==='b6-xlsx'){closeModal();var k=ds.k;
    if(k==='tt')saveXlsx(isSpecial()?'timetable':ui.print.kind+'_timetables',xlsxTimetables());
    else if(k==='wl')saveXlsx('workload',[xlsxSimple('Workload',csvRows(wlCsv()))]);
    else if(k==='cv')saveXlsx('cover',xlsxCover());
    else if(k==='dr'){var sh=deptSheets();if(!sh.length){toast('No departments with teachers or subjects yet');return;}saveXlsx('department_reports',sh);}}
  else if(a==='b6-lock'){cmClose();if(!W.prefs.pin){openPin('set');return;}ui.unlocked=false;render();toast('Locked. The app is view-only.');}
  else if(a==='b6-unlock'){cmClose();openPin('unlock');}
  else if(a==='b6-pin-set')openPin('set');
  else if(a==='b6-pin-change')openPin('change');
  else if(a==='b6-pin-remove')openPin('remove');
  else if(a==='b6-pin-ok')pinOk(ds.m);
  else if(a==='b6-display'){cmClose();liveOpen();}
  else if(a==='b6-live-exit')liveClose();
  else if(a==='b6-bell-test'){var b=bellCfg();ringBell(b.sound,Math.min(+b.len||4,4),b.vol);}
  else if(a==='b6-bk-day'){ui.bkDate=addDays(ui.bkDate||isoDate(new Date()),+ds.d);render();}
  else if(a==='b6-bk-new'){var P=D.school.periods;openBooking({roomId:ds.room,date:ui.bkDate||isoDate(new Date()),pid:P[+ds.i].id,n:1,teacherId:'',what:''});}
  else if(a==='b6-bk-edit'){var bk=by(bookings(),ds.id);if(bk)openBooking(JSON.parse(JSON.stringify(bk)));}
  else if(a==='b6-bk-save')saveBooking(false);
  else if(a==='b6-bk-force'){var pb=ui.bkPending;ui.bkPending=null;closeModal();if(pb)mutate(function(){var L=bookings();if(pb.id){var i=L.findIndex(function(x){return x.id===pb.id;});if(i>=0)L[i]=pb;}else{pb.id=uid();L.push(pb);}});toast('Room booked');}
  else if(a==='b6-bk-del'){var id=(ui.bk||{}).id;closeModal();if(id)mutate(function(){D.bookings=bookings().filter(function(x){return x.id!==id;});});toast('Booking cancelled');}
  else if(a==='b6-bk-print')printHtml(bookingSheet(ui.bkDate||isoDate(new Date())));
  else if(a==='b6-cvn')openCoverNotices(ds.date);
  else if(a==='b6-cvn-wa'||a==='b6-cvn-mail'){var n=coverNotices(ui.cvnDate).filter(function(x){return x.t.id===ds.id;})[0];if(!n)return;var msg=coverMsg(n,ui.cvnDate);openUrl(a==='b6-cvn-wa'?waLink(n.t.phone,msg):mailLink(n.t.email,'Cover on '+dLabel(ui.cvnDate),msg));}
  else if(a==='b6-cvn-group'){openUrl('https://wa.me/?text='+encodeURIComponent(($('#cvn-all')||{}).value||''));}
  else if(a==='b6-asp-add'){var pl=asPlan();if(pl.err){toast(pl.err);return;}var as=asCfg(),tag='assess:'+as.termId,secs=as.secs.length?as.secs:schoolSections().filter(Boolean);
    mutate(function(){var c=calOf();c.events=c.events.filter(function(e){return e.gen!==tag;});pl.ev.forEach(function(e){var sum=/^Summative/.test(e.title),stop=sum&&as.stop==='sum';c.events.push({id:uid(),title:e.title,cat:'assess',date:e.date,to:e.to,allDay:true,start:'',end:'',stop:stop?(secs.length&&secs.length<schoolSections().filter(Boolean).length?'sections':'all'):'none',sections:stop?secs:[],where:'',note:pl.term.name,gen:tag});});});
    toast(pl.ev.length+' assessments added to the calendar');}
  else if(a==='b6-asp-clear'){var tg='assess:'+asCfg().termId;mutate(function(){var c=calOf();c.events=c.events.filter(function(e){return e.gen!==tg;});});toast('Planned assessments removed');}
  else if(a==='b6-opt-file'){var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.txt';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var ls=optImport(rd.result);if(!ls.length){toast('No learners found in '+f.name);return;}mutate(function(){var o=optOf();o.learners=ls;o.res=null;});toast(ls.length+' learners imported');};rd.readAsText(f);};inp.click();}
  else if(a==='b6-opt-paste'){var ls2=optImport(($('#opt-paste')||{}).value||'');if(!ls2.length){toast('Paste learner rows first');return;}mutate(function(){var o=optOf();o.learners=ls2;o.res=null;});toast(ls2.length+' learners added');}
  else if(a==='b6-opt-tpl'){download('learner_choices_template.csv','﻿Learner,Class,Choice 1,Choice 2,Choice 3,Choice 4\r\nMwila Banda,IGCSE 10A,Biology,Geography,Art & Design,Commerce\r\nChanda Phiri,IGCSE 10B,Chemistry,History,Computer Science,Biology\r\n','text/csv');}
  else if(a==='b6-opt-clear'){mutate(function(){var o=optOf();o.learners=[];o.res=null;});}
  else if(a==='b6-opt-build'){mutate(function(){optBuild();});toast('Blocks built');}
  else if(a==='b6-opt-lessons')optLessons();
  else if(a==='b6-opt-x'){var r=optOf().res;if(!r)return;var mx=Math.max.apply(null,r.learners.map(function(l){return l.b.length;}));var rows=[['Learner',word('wClass')].concat(Array.from({length:mx},function(_,i){return 'Choice '+(i+1);}))];r.learners.forEach(function(l){rows.push([l.n,l.c].concat(l.b.map(function(x){return x.s+(x.g?' '+x.g:'')+(x.b>=0?' (Block '+(x.b+1)+')':' (does not fit)');})));});
    var bl=[['Block','Subject','Group','Learners']];r.blocks.forEach(function(b,i){b.forEach(function(x){bl.push(['Block '+(i+1),x.s,x.g,x.n]);});});
    saveXlsx('option_blocks',[xlsxSimple('Learners',rows),xlsxSimple('Blocks',bl,[12,26,10,12])]);}
  else if(a==='b6-dr-print'){var hh=deptPrintHtml();if(!hh){toast('Nothing to print yet');return;}printHtml(hh);}
  else if(a==='b6-dr-xlsx'){var s2=deptSheets();if(!s2.length){toast('No departments with teachers or subjects yet');return;}saveXlsx('department_reports',s2);}
}
function b6Field(el,type){
  var f=el.dataset.b6,k=el.dataset.k,txt=el.type==='text'||el.tagName==='TEXTAREA';
  if(type==='input'&&!(el.type==='range'))return;
  if(f==='bell'){var b=bellCfg();b[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:(k==='len'?+el.value:el.value);syncActive();persist();if(el.type!=='range')render();else updateChrome();return;}
  if(type!=='change')return;
  if(f==='set'){sset()[k]=el.checked;syncActive();persist();return;}
  if(f==='pref'){W.prefs[k]=el.checked;saveQuiet();fileDirty();return;}
  if(f==='bkdate'){ui.bkDate=el.value;render();return;}
  if(f==='drdep'){ui.drDep=el.value;render();return;}
  if(f==='asp'){var a=asCfg();a[k]=el.type==='checkbox'?el.checked:el.type==='number'?(+el.value||0):el.value;syncActive();persist();render();return;}
  if(f==='aspsec'){var a2=asCfg();a2.secs=$$('[data-b6=aspsec]').filter(function(x){return x.checked;}).map(function(x){return x.value;});syncActive();persist();return;}
  if(f==='opt'){mutate(function(){optOf()[k]=Math.max(1,+el.value||1);});return;}
}

function filePill(){if(!FILE)return '';return '<span class="pill'+(FILE.dirty?' warn':'')+'" title="'+esc(FILE.path||FILE.name)+'">'+esc(FILE.name)+(FILE.dirty?' · unsaved':' · saved')+'</span>';}
function hostStart(){
  var q=location.search||'';
  if(!HOST){if(/display=1/.test(q)||W.prefs.liveOnStart)liveOpen();return;}
  setInterval(function(){hostCall('beat').then(function(r){if(r&&r.open)fileOpenPath(r.open);}).catch(function(){});},5000);
  hostCall('start').then(function(r){
    HOST.portable=!!r.portable;HOST.dataDir=r.dataDir||'';HOST.version=r.version||'';
    var arg=(r.args||[]).filter(function(a){return /\.(stt|json)$/i.test(a);})[0];
    if(arg)fileOpenPath(arg);
    else{try{var cf=JSON.parse(localStorage.getItem('stt.curfile')||'null');if(cf&&cf.path){FILE={path:cf.path,name:cf.name,dirty:false,saved:Date.now()};updateChrome();}}catch(e){}}
    if(W.prefs.liveOnStart||/display=1/.test(q))liveOpen();
  }).catch(function(){});
}

function hexRgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbHex(r){return '#'+r.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return ('0'+v.toString(16)).slice(-2);}).join('');}
function mixHex(a,b,t){var x=hexRgb(a),y=hexRgb(b);return rgbHex([0,1,2].map(function(i){return x[i]+(y[i]-x[i])*t;}));}
function hueOf(h){var c=hexRgb(h).map(function(v){return v/255;}),mx=Math.max.apply(null,c),mn=Math.min.apply(null,c),d=mx-mn,hh=0;if(!d)return 0;if(mx===c[0])hh=((c[1]-c[2])/d)%6;else if(mx===c[1])hh=(c[2]-c[0])/d+2;else hh=(c[0]-c[1])/d+4;return Math.round((hh*60+360)%360);}

}

function entriesB7(kind,l,id){

  function R(p){if(!o.room)return '';if(p.roomId)return rname(p.roomId);var hc=lcls(l).map(function(c){return by(D.classes,c);}).filter(function(c){return c&&c.roomId;});return hc.length===1||(kind==='class'&&hc.length)?rname((kind==='class'&&by(D.classes,id)&&by(D.classes,id).roomId)||hc[0].roomId):'';}
  if(kind==='class'){

    if(ps.length<2){var p=ps[0]||{};out.push({t:dSub(p.subjectId,o),si:p.subjectId,n:l.note||'',a:[p.teacherId?T(p):'No teacher',w].filter(Boolean).join(' · '),b:R(p)});}

function exLearners(){var t=srcTT(),ls=t&&t.data.learners||[];return ls;}

function seatPlan(key){
  var d=D,dd=dir(),dt=key.split('|')[0],si=+key.split('|')[1],ps=d.ex.papers.filter(function(p){return p.date===dt&&exSession(d,p)===si;});
  var lay=d.ex.layout=d.ex.layout||{},order=(d.ex.seatOrder||'name');
  var groups=ps.map(function(p){var cands=[];p.classIds.forEach(function(cid){var c=by(dd.classes,cid);var ls=exLearners().filter(function(l){return l.classId===cid&&(!(l.subjects&&l.subjects.length)||!p.subjectId||l.subjects.indexOf(p.subjectId)>=0||isCompulsory(cid,p.subjectId));});
      if(ls.length)ls.forEach(function(l){cands.push({name:l.name,cand:l.cand||'',cls:c?c.name:'',p:p});});
      else for(var k=1;k<=((c&&c.size)||0);k++)cands.push({name:(c?c.name:'')+' candidate '+k,cand:'',cls:c?c.name:'',p:p});});
    cands.sort(function(a,b){return order==='cand'?String(a.cand).localeCompare(String(b.cand),undefined,{numeric:true}):a.name.localeCompare(b.name,undefined,{numeric:true});});return cands;});
  var seen={};groups=groups.map(function(g){return g.filter(function(c){var k=c.cls+'|'+c.name;if(seen[k])return false;seen[k]=1;return true;});});
  /* interleave papers so neighbours sit different papers */
  var seq=[],more=true,ix=0;while(more){more=false;groups.forEach(function(g){if(g[ix]){seq.push(g[ix]);more=true;}});ix++;}
  var roomIds=uniq([].concat.apply([],ps.map(function(p){return p.rooms||[];})));if(!roomIds.length)roomIds=['_hall'];
  var rooms=roomIds.map(function(rid){var r=by(dd.rooms,rid),L=lay[rid]||{},cap=r&&r.cap?r.cap:30,cols=L.cols||Math.max(1,Math.ceil(Math.sqrt(cap*1.2))),rows=L.rows||Math.ceil(cap/cols);return {id:rid,name:r?r.name:'Exam room',rows:rows,cols:cols,seats:[]};});
  var k=0;rooms.forEach(function(r){for(var c=0;c<r.cols;c++)for(var rr=0;rr<r.rows;rr++){var s=seq[k];r.seats.push({row:rr,col:c,c:s||null,n:String.fromCharCode(65+c)+(rr+1)});if(s)k++;}});
  return {dt:dt,si:si,ps:ps,rooms:rooms,left:seq.length-k,total:seq.length};
}

/* ===== batch 7: workload fairness and fair cover ===== */
function coverCounts(tid){
  var now=new Date(),today=isoDate(now),wk=isoDate(new Date(now.getTime()-((now.getDay()+6)%7)*864e5)),m30=isoDate(new Date(now.getTime()-30*864e5)),r={week:0,d30:0,all:0};
  coverOf().absences.forEach(function(a){Object.keys(a.subs||{}).forEach(function(k){if(a.subs[k]!==tid)return;r.all++;if(a.date>=m30&&a.date<=today)r.d30++;if(a.date>=wk&&a.date<=today)r.week++;});});
  return r;
}
var _coverSuggest=coverSuggest;
coverSuggest=function(a,x){
  var res=_coverSuggest(a,x);
  res.forEach(function(r){var c=coverCounts(r.id);r.n=c.all;r.recent=c.d30;r.score+=c.d30*4+c.week*6;});
  return res.sort(function(p,q){return p.score-q.score;});
};
function fairRows(){
  var w=workload(),rows=w.rows.map(function(r){var load=r.tot+r.cv+r.du*0.5+r.iv*0.5+r.bd*0.5;return {t:r.t,tot:r.tot,cv:r.cv,du:r.du,iv:r.iv,bd:r.bd,free:r.free,load:load};});
  var act=rows.filter(function(r){return r.load>0;}),avg=act.length?act.reduce(function(s,r){return s+r.load;},0)/act.length:0;
  var cavg=act.length?act.reduce(function(s,r){return s+r.cv;},0)/act.length:0;
  rows.forEach(function(r){r.alerts=[];if(avg&&r.load>avg*1.2)r.alerts.push('carries '+Math.round((r.load/avg-1)*100)+'% more than average');
    var md=r.t.maxDay||0;if(md&&r.tot>md*D.school.days.length)r.alerts.push('more periods than the daily maximum allows');
    if(r.cv>cavg+2)r.alerts.push('has covered '+r.cv+' lessons (average '+Math.round(cavg*10)/10+')');});
  return {rows:rows.sort(function(a,b){return b.load-a.load;}),avg:avg};
}
function fairCard(){
  var f=fairRows();if(!f.rows.length)return '';var mx=Math.max.apply(null,[1].concat(f.rows.map(function(r){return r.load;})));
  var al=f.rows.filter(function(r){return r.alerts.length;});
  return '<section class="card"><div class="row sp"><h2>'+ico('chart',18)+' Fairness</h2><div class="flegend"><span><i class="fp"></i>Periods</span><span><i class="fc"></i>Cover</span><span><i class="fd"></i>Duties</span><span><i class="fi"></i>Invigilation</span><span><i class="fb"></i>Boarding</span></div></div>'+
   (al.length?'<ul class="issues">'+al.map(function(r){return '<li class="warn"><b>'+esc(r.t.name)+'</b> '+esc(r.alerts.join('; '))+'</li>';}).join('')+'</ul>':'<p class="pill ok" style="justify-self:start">No one is overloaded.</p>')+
   '<div class="fbars">'+f.rows.map(function(r){function seg(v,c,k){return v?'<i class="'+c+'" style="width:'+(v/mx*100)+'%" title="'+k+': '+v+'"></i>':'';}
     return '<div class="fbar'+(r.alerts.length?' over':'')+'"><span class="fn">'+esc(r.t.name)+'</span><span class="ft">'+seg(r.tot,'fp','Periods')+seg(r.cv,'fc','Cover')+seg(r.du*0.5,'fd','Duties')+seg(r.iv*0.5,'fi','Invigilation')+seg(r.bd*0.5,'fb','Boarding')+'<em style="left:'+(f.avg/mx*100)+'%" title="Average"></em></span><span class="fv">'+(Math.round(r.load*10)/10)+'</span></div>';}).join('')+'</div>'+

function quality(){

  var hard=allIssues().filter(function(i){return i.sev==='hard';}).length;hit('clash','Clashes',hard,5,30);
  var gaps=0,over=0,prefv=0,heavy=0,rep=0,lt=lastTeach();

    var idx=Object.keys(occ).map(Number);if(idx.length>1){var lo=Math.min.apply(null,idx),hi=Math.max.apply(null,idx);for(var i=lo;i<=hi;i++)if(P[i]&&!P[i].brk&&!occ[i])gaps++;}
    if(t.maxDay>0&&cnt>t.maxDay)over++;});});
  D.placements.forEach(function(p){var l=lesson(p.lessonId);if(!l)return;var i=periodIndex(p.pid);if(isHeavy(l)&&i+(l.length||1)-1>=lt)heavy++;});
  D.classes.forEach(function(cl){days.forEach(function(d){var seen={};D.placements.forEach(function(p){if(p.day!==d)return;var l=lesson(p.lessonId);if(!l||lcls(l).indexOf(cl.id)<0||lparts(l).length>1)return;var s=lparts(l)[0].subjectId,i=periodIndex(p.pid);(seen[s]=seen[s]||[]).push(i);});
    Object.keys(seen).forEach(function(s){var a=seen[s].sort(function(x,y){return x-y;});for(var k=1;k<a.length;k++)if(a[k]-a[k-1]>1)rep++;});});});
  hit('gaps','Teacher free periods between lessons',gaps,0.35,15);
  hit('rep','Same subject twice in a day, not as a double',rep,0.6,10);
  hit('heavy','Heavy subjects in the last period',heavy,0.6,8);
  hit('pref','Lessons at a teacher\'s "prefer not" time',prefv,1,10);

function improve(ms){
  var t0=Date.now(),start=quality().score,best=start,P=D.school.periods,days=D.school.days,tries=0,moves=0;
  var slots=[];days.forEach(function(d){P.forEach(function(p,i){if(!p.brk)slots.push([d,i]);});});
  /* first try to place anything left */
  var ord=lessonOrd();D.lessons.forEach(function(l){var left=(l.perWeek||0)-placedCount(l.id);for(var k=0;k<left;k++){var b=bestSlot(l.id);if(b)D.placements.push({id:uid(),lessonId:l.id,day:b.d,pid:b.pid,locked:false});}});
  best=quality().score;

    var p=mov[Math.floor(Math.random()*mov.length)],s=slots[Math.floor(Math.random()*slots.length)];tries++;

function fitMeta(html){
  var nl=(html.match(/<(b|span)[\s>]/g)||[]).length+(html.match(/<hr>/g)||[]).length*0.5;
  var segs=html.split(/<hr>|<\/b>|<\/span>/).map(function(s){return s.replace(/<[^>]+>/g,'').replace(/&[a-z#0-9]+;/gi,'x').trim().length;});
  return {nl:Math.max(1,nl),nc:Math.max(5,Math.max.apply(null,segs.concat([0])))};
}
function fitWrap(html){if(ui.print.fill===false)return html;var m=fitMeta(html);return '<div class="fx"><div class="fxi" data-nl="'+m.nl+'" data-nc="'+m.nc+'">'+html+'</div></div>';}
/* sizes the text of every lesson box so it fills about 70% of the box; also copied into downloaded pages */
function fitSheets(root){
  var els=[].slice.call((root||document).querySelectorAll('.sheet.fill td.pl .fxi'));
  var info=els.map(function(fi){var fx=fi.parentNode;return {fi:fi,W:fx.clientWidth,H:fx.clientHeight,nl:+fi.getAttribute('data-nl')||1,nc:+fi.getAttribute('data-nc')||8};}).filter(function(o){return o.W>0&&o.H>0;});
  info.forEach(function(o){o.f=Math.max(6,Math.min(o.H*0.7/(o.nl*1.15),o.W/(o.nc*0.6),64));o.fi.style.fontSize=o.f+'px';});
  for(var round=0;round<5;round++){
    var m=info.map(function(o){return {h:o.fi.offsetHeight,w:o.fi.scrollWidth};}),changed=false;
    info.forEach(function(o,i){
      var r=m[i],t=o.H*0.7,nf=o.f;
      if(r.h>o.H*0.76||r.w>o.W+1)nf=o.f*Math.min(0.93,Math.sqrt(t/Math.max(1,r.h)),r.w>o.W+1?o.W/r.w:1);
      else if(round<3&&r.h<o.H*0.62)nf=Math.min(64,o.f*Math.min(1.25,Math.sqrt(t/Math.max(1,r.h))));
      if(Math.abs(nf-o.f)>0.25){o.f=Math.max(6,nf);o.fi.style.fontSize=o.f+'px';changed=true;}
    });
    if(!changed)break;
  }
}

function gridHtml(days,P,cellAt,flip,o){

  function pcell(c,span){return '<td class="pl'+(c.bad?' bad':'')+'" '+span+' style="--h:'+c.hue+'">'+fitWrap(c.html)+'</td>';}

      days.forEach(function(d){

      });
      h+='</tr>';
    });
  }else{
    h+='<thead><tr><th class="corner"></th>'+P.map(function(p){return p.brk?'<th class="brk"></th>':'<th>'+esc(p.label)+(o.times?'<small>'+esc(p.start)+'</small>':'')+'</th>';}).join('')+'</tr></thead><tbody>';
    days.forEach(function(d,di){

      P.forEach(function(p,i){
        if(skip[d+'|'+i])return;
        if(p.brk){if(di===0)h+='<td class="brk brkcol" rowspan="'+days.length+'"><span class="vt">'+esc(p.label)+(o.times&&p.start?' · '+esc(p.start)+' to '+esc(p.end):'')+'</span></td>';return;}

function confirmBox(msg,ok){
  return new Promise(function(res){
    openModal('Please confirm','<p>'+esc(msg)+'</p><div class="row"><button class="btn danger" data-act="yes">'+esc(ok||'Continue')+'</button><button class="btn" data-act="no">Cancel</button></div>');
    var d=$('#dlg');
    function done(v){d.removeEventListener('click',h);d.removeEventListener('close',c);res(v);}
    function h(e){var b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='yes'){closeModal();done(true);}else if(b.dataset.act==='no'||b.dataset.act==='close'){closeModal();done(false);}}
    function c(){done(false);}
    d.addEventListener('click',h);d.addEventListener('close',c,{once:true});
  });
}

function findBy(arr,key){key=String(key||'').trim().toLowerCase();if(!key)return null;for(var i=0;i<arr.length;i++){var a=arr[i];if(String(a.name).toLowerCase()===key||(a.short&&String(a.short).toLowerCase()===key))return a;}return null;}
function bulkAdd(ent,txt){
  var lines=String(txt||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){return l.split(/\t|,|;/).map(function(x){return x.trim();});});
  if(!lines.length){toast('Paste some rows first');return;}
  addRows(ent,lines);

function addRows(ent,lines){
  var made={teachers:0,classes:0,subjects:0,rooms:0},added=0,upd=0,skip=0;
  function yes(v){return /^(y|yes|true|1|shared)$/i.test(String(v||'').trim());}
  function sexOf(v){v=String(v||'').trim().toLowerCase();return /^f/.test(v)?'F':/^m/.test(v)?'M':'';}
  mutate(function(){
    lines.forEach(function(c){
      c=c.map(function(x){return String(x==null?'':x).trim();});
      if(ent!=='lessons'){
        if(!c[0]){skip++;return;}
        var ex=findBy(D[ent]||[],c[0]);
        if(ent==='teachers'){var dp=c[6]?ensureDept(c[6]):null;
          if(ex){if(c[1])ex.short=c[1];if(c[2])ex.maxDay=+c[2]||0;if(c[3])ex.sex=sexOf(c[3]);if(c[4])ex.phone=c[4];if(c[5])ex.email=c[5];if(dp)ex.deptId=dp.id;upd++;}
          else{D.teachers.push({id:uid(),name:c[0],short:c[1]||'',maxDay:+c[2]||0,unav:[],sex:sexOf(c[3]),phone:c[4]||'',email:c[5]||'',deptId:dp?dp.id:''});added++;}}
        else if(ent==='classes'){if(ex){if(c[1])ex.size=+c[1]||0;upd++;}else{D.classes.push({id:uid(),name:c[0],size:+c[1]||0});added++;}}
        else if(ent==='subjects'){var dp2=c[3]?ensureDept(c[3]):null;
          if(ex){if(c[1])ex.short=c[1];if(c[2])ex.code=c[2];if(dp2)ex.deptId=dp2.id;upd++;}else{D.subjects.push({id:uid(),name:c[0],short:c[1]||'',code:c[2]||'',deptId:dp2?dp2.id:'',hue:HUES[D.subjects.length%HUES.length][0]});added++;}}
        else if(ent==='rooms'){var ty=ROOM_TYPES.filter(function(t){return t.toLowerCase()===String(c[1]||'').toLowerCase();})[0];
          if(ex){if(ty)ex.type=ty;if(c[2])ex.cap=+c[2]||0;if(c[3])ex.shared=yes(c[3]);upd++;}else{D.rooms.push({id:uid(),name:c[0],type:ty||'Classroom',cap:+c[2]||0,shared:yes(c[3])});added++;}}
        else if(ent==='departments'){var hd=c[1]?findBy(D.teachers,c[1]):null;
          if(ex){if(hd)ex.head=hd.id;upd++;}else{var nd=ensureDept(c[0]);if(hd)nd.head=hd.id;added++;}}
        return;
      }
      if(c.length<2||!c[0]||!c[1]){skip++;return;}
      function get(arr,key,mk){var f=findBy(arr,key);if(!f&&key){f=mk(key);arr.push(f);}return f;}
      function tch(k){return get(D.teachers,k,function(n){made.teachers++;return {id:uid(),name:n,short:'',maxDay:0,unav:[],sex:'',phone:'',email:'',deptId:''};});}
      var cls=String(c[0]).split('+').map(function(x){return x.trim();}).filter(Boolean).map(function(k){return get(D.classes,k,function(n){made.classes++;return {id:uid(),name:n,size:0};}).id;});
      var subs=String(c[1]).split('|').map(function(x){return x.trim();}),tes=String(c[2]||'').split('|').map(function(x){return x.trim();}),ros=String(c[3]||'').split('|').map(function(x){return x.trim();}),grs=String(c[7]||'').split('|').map(function(x){return x.trim();});
      var parts=subs.filter(Boolean).map(function(sn,i){
        var su=get(D.subjects,sn,function(k){made.subjects++;return {id:uid(),name:k,short:'',code:'',deptId:'',hue:HUES[D.subjects.length%HUES.length][0]};});
        var two=String(tes[i]||'').split('&').map(function(x){return x.trim();}).filter(Boolean),te=two[0]?tch(two[0]):null,co=two[1]?tch(two[1]):null;
        var ro=ros[i]?get(D.rooms,ros[i],function(k){made.rooms++;return {id:uid(),name:k,type:'Classroom',cap:0,shared:false};}):null;
        return {subjectId:su.id,teacherId:te?te.id:'',coId:co?co.id:'',roomId:ro?ro.id:'',group:grs[i]||''};
      });
      if(!cls.length||!parts.length){skip++;return;}
      D.lessons.push({id:uid(),classIds:cls,parts:parts,perWeek:+c[4]||1,length:Math.min(3,Math.max(1,+c[5]||1)),note:c[6]||''});added++;
    });
  });
  var ex2=Object.keys(made).filter(function(k){return made[k];}).map(function(k){return made[k]+' new '+k;});
  toast('Added '+added+(upd?', updated '+upd:'')+(skip?', skipped '+skip+' incomplete':'')+'.'+(ex2.length?' Created '+ex2.join(', ')+'.':''));
}
function delRow(ent,id){
  var msg='',n=0;
  if(ent==='classes'){n=D.lessons.filter(function(l){return lcls(l).indexOf(id)>=0;}).length;var solo=D.lessons.filter(function(l){return lcls(l).length===1&&lcls(l)[0]===id;}).length;if(n)msg='This removes the class from '+n+' lesson'+(n>1?'s':'')+(solo?' and deletes '+solo+' that only had this class':'')+'.';}
  if(ent==='subjects'){n=D.lessons.filter(function(l){return lparts(l).some(function(p){return p.subjectId===id;});}).length;if(n)msg='This removes the subject from '+n+' lesson'+(n>1?'s':'')+'. Lessons with nothing left are deleted.';}
  if(ent==='teachers'){n=D.lessons.filter(function(l){return lTeachers(l).indexOf(id)>=0;}).length;if(n)msg=n+' lesson'+(n>1?'s':'')+' will be left without a teacher.';}
  if(ent==='rooms'){n=D.lessons.filter(function(l){return lRooms(l).indexOf(id)>=0;}).length;if(n)msg=n+' lesson'+(n>1?'s':'')+' will go back to the class room.';}
  function go(){mutate(function(){
    D[ent]=D[ent].filter(function(x){return x.id!==id;});
    if(ent==='classes'){D.lessons.forEach(function(l){l.classIds=lcls(l).filter(function(c){return c!==id;});});D.lessons=D.lessons.filter(function(l){return l.classIds.length||l.act;});}
    if(ent==='subjects'){D.lessons.forEach(function(l){l.parts=lparts(l).filter(function(p){return p.subjectId!==id;});});D.lessons=D.lessons.filter(function(l){return l.parts.length;});}
    if(ent==='teachers'){D.lessons.forEach(function(l){lparts(l).forEach(function(p){if(p.teacherId===id)p.teacherId='';if(p.coId===id)p.coId='';});});depts().forEach(function(d){if(d.head===id)d.head='';});}
    if(ent==='departments')D.subjects.concat(D.teachers).forEach(function(x){if(x.deptId===id)x.deptId='';});
    if(ent==='rooms')D.lessons.forEach(function(l){lparts(l).forEach(function(p){if(p.roomId===id)p.roomId='';});});
  });}
  if(msg)confirmBox(msg,'Delete').then(function(ok){if(ok)go();});else go();
}

document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();var eb=$('[data-act="'+e.target.dataset.enter+'"]');if(eb)eb.click();return;}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key.toLowerCase()==='s'||e.key.toLowerCase()==='o')){e.preventDefault();if(e.key.toLowerCase()==='o')fileOpen();else fileSave(e.shiftKey);return;}
  if((e.ctrlKey||e.metaKey)&&!typing){
    var k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo();return;}
    if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();doRedo();return;}
  }
  if(e.key==='Escape'&&LIVE.on){liveClose();return;}
  if(e.key==='Escape'&&!$('#cmenu').hidden){cmClose();return;}
  if(e.key==='Escape'&&ui.lift){ui.lift=null;render();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&!typing&&ui.lift&&ui.lift.type==='move'){e.preventDefault();unplace(ui.lift.plId);return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.dcell')){e.preventDefault();e.target.click();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-drag]')){e.preventDefault();e.target.click();}
});
