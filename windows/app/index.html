/* Infinity Timetable v2.0.0 (batch 7). v1.7.0 renamed from School Timetabler. v1.6.0 (batch 6). v1.5 (batch 5). v1.4 (batch 4). v1.3 (batch 3). Was v1. One file, no internet needed. Layout: top bar, section nav, work area. */
:root{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface-2:#E6EDED; --fg:#10242A; --muted:#4A5E65; --line:#C8D4D6;
  --accent:#0B6B5C; --accent-fg:#FFFFFF; --accent-bg:#D6EEE7;
  --bad:#B3261E; --bad-bg:#FBE1DF; --warn:#9A4A06; --warn-bg:#FBE8D5; --ok:#1D6B34; --ok-bg:#DCF1E0;
  --pc-bg:88%; --pc-s:62%; --pc-fg:20%; --pc-bd:68%;
  --font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1D; --surface:#14252A; --surface-2:#1B3036; --fg:#E3EEEE; --muted:#9BB1B6; --line:#2B454B;
    --accent:#52C5B0; --accent-fg:#06281F; --accent-bg:#173A33;
    --bad:#FF8F86; --bad-bg:#3E1E1C; --warn:#F0A465; --warn-bg:#3A2715; --ok:#7FD79A; --ok-bg:#16351F;
    --pc-bg:24%; --pc-s:36%; --pc-fg:90%; --pc-bd:38%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A1D; --surface:#14252A; --surface-2:#1B3036; --fg:#E3EEEE; --muted:#9BB1B6; --line:#2B454B;
  --accent:#52C5B0; --accent-fg:#06281F; --accent-bg:#173A33;
  --bad:#FF8F86; --bad-bg:#3E1E1C; --warn:#F0A465; --warn-bg:#3A2715; --ok:#7FD79A; --ok-bg:#16351F;
  --pc-bg:24%; --pc-s:36%; --pc-fg:90%; --pc-bd:38%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand b{font-family:var(--font-d);font-size:1.05rem;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.status{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.pill{font:12px/1 var(--mono);padding:6px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:4px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){color:var(--accent-fg);filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}

.shell{display:grid;grid-template-columns:184px minmax(0,1fr);align-items:start}
.side{position:sticky;top:56px;display:flex;flex-direction:column;padding:14px 8px 14px 12px;gap:2px;max-height:calc(100vh - 56px);overflow:auto}
.side button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:4px;color:var(--fg);display:flex;justify-content:space-between;gap:8px;align-items:center}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.side .cnt{font:11px var(--mono);color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:8px 6px}
main{padding:18px 18px 64px;min-width:0;display:grid;gap:16px;align-content:start}
.pagehead{display:grid;gap:4px}
.pagehead .lead{color:var(--muted);max-width:75ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.banner.info{background:var(--accent-bg);color:var(--accent)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
.in:focus{border-color:var(--accent)}
select.in{padding:6px 4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;background:var(--surface-2);font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;background:hsl(var(--h) var(--pc-s) var(--pc-bg));border:1px solid hsl(var(--h) 40% var(--pc-bd))}
details.bulk summary{cursor:pointer;color:var(--accent);font-weight:600}
details.bulk textarea{width:100%;margin-top:8px;font:12px/1.5 var(--mono);min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* timetable */
.ttbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;margin-left:-1px}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);position:relative}
.ent{display:flex;gap:4px;align-items:center}
.ent select{min-width:170px}
.ttmain{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:14px;align-items:start}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tt{display:grid;grid-template-columns:76px repeat(var(--nd),minmax(112px,1fr));grid-template-rows:auto repeat(var(--np),minmax(58px,auto));min-width:calc(76px + var(--nd) * 112px)}
.th{background:var(--surface-2);padding:8px;font:600 12px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.07em;text-align:center;color:var(--muted)}
.tl{padding:6px 8px;font:12px/1.3 var(--mono);color:var(--muted);border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.tl b{color:var(--fg);font-weight:600}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:58px}
.cell.ok{background:var(--ok-bg);outline:2px dashed var(--ok);outline-offset:-3px}
.cell.warn{background:var(--warn-bg);outline:2px dashed var(--warn);outline-offset:-3px}
.cell.bad{background:var(--bad-bg)}
.brk{grid-column:1 / -1;background:var(--surface-2);border-top:1px solid var(--line);color:var(--muted);font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;min-height:24px}
.pcard,.chip{--h:200;background:hsl(var(--h) var(--pc-s) var(--pc-bg));color:hsl(var(--h) 50% var(--pc-fg));border:1px solid hsl(var(--h) 40% var(--pc-bd));border-radius:4px;padding:4px 6px;font-size:12px;line-height:1.25;user-select:none}
.pcard{position:relative;z-index:2;margin:3px 3px 3px calc(100% / var(--n) * var(--lane) + 3px);width:calc(100% / var(--n) - 6px);overflow:hidden;cursor:grab;min-width:0}
.pcard .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px}
.pcard .t i{font-style:normal;font-weight:400;opacity:.8}
.pcard .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
.pcard>div:first-child{padding-right:30px}
.pcard .s b{font-weight:600}
.wbar{position:relative;min-width:80px;height:20px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.wbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.25}
.wbar b{position:relative;padding:0 6px;line-height:20px;font-size:12px}
.tscroll{overflow:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
.tbl.mx th,.tbl.mx td{border:1px solid var(--line)}
.tbl.mx td{min-width:104px}
.tbl.mx th[scope=row]{background:var(--surface-2);color:var(--text)}
.mxp{--h:200;background:hsl(var(--h) var(--pc-s) var(--pc-bg));color:hsl(var(--h) 50% var(--pc-fg));border:1px solid hsl(var(--h) 40% var(--pc-bd));border-radius:4px;padding:3px 6px;margin:2px 0;font-size:12px}
.mxm{outline:2px solid var(--bad);outline-offset:-2px}
.dcell{cursor:pointer}.dcell:hover,.dcell:focus-visible{background:var(--surface-2)}
.dcell.short{background:var(--warn-bg)}
.tbl td.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--surface-2) 6px 12px)}
.btn.warnb{border-color:var(--warn);color:var(--warn)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin:8px 0;max-height:52vh;overflow:auto}
.pk{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.pk small{display:block;color:var(--muted);font-size:11px}
.pk.bad{border-color:var(--bad)}.pk.bad small{color:var(--bad)}
.issues{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.issues li{padding:7px 10px;border-radius:4px;border-left:3px solid}
.issues li.bad{background:var(--bad-bg);border-color:var(--bad)}.issues li.warn{background:var(--warn-bg);border-color:var(--warn)}
.ttype{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ttype label{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;gap:8px;cursor:pointer;align-items:flex-start}
.ttype label small{display:block;color:var(--muted)}
.pcard .btns{position:absolute;top:2px;right:2px;display:flex;gap:2px}
.pcard .btns button{border:0;background:transparent;color:inherit;padding:2px;border-radius:3px;line-height:0;opacity:.6}
.pcard .btns button:hover{opacity:1;background:hsl(var(--h) 40% var(--pc-bd) / .4)}
.pcard.locked{cursor:default;border-style:dashed}
.pcard.locked .btns .lk{opacity:1}
.pcard.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)}
.pcard.sel,.chip.sel{outline:3px solid var(--accent);outline-offset:1px}
body.dragging .pcard{opacity:.38;pointer-events:none}
body.lifting .pcard:not(.sel){opacity:.5}
.reason{min-height:24px;font-size:13px;color:var(--muted);padding:2px 2px}
.reason.bad{color:var(--bad)} .reason.ok{color:var(--ok)} .reason.warn{color:var(--warn)}
.tray{display:grid;gap:8px;align-content:start}
.tray .chips{display:grid;gap:6px}
.chip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;cursor:grab;padding:7px 9px}
.chip .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .s{grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
.chip .k{grid-row:1 / span 2;grid-column:2;align-self:center;font:600 12px var(--mono);background:hsl(var(--h) 40% var(--pc-bd) / .5);border-radius:3px;padding:3px 6px}
.tray.drop{outline:2px dashed var(--accent);outline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px;border-radius:2px}
.legend .l-ok{background:var(--ok-bg);outline:1.5px dashed var(--ok);outline-offset:-2px}
.legend .l-bad{background:var(--bad-bg);outline:1.5px solid var(--bad);outline-offset:-2px}
.legend .l-warn{background:var(--warn-bg);outline:1.5px dashed var(--warn);outline-offset:-2px}

.ibadge{flex:none;display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,hsl(var(--ih) 80% 64%),hsl(var(--ih) 72% 40%));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 5px hsl(var(--ih) 60% 30% / .35)}
.ibadge .ico{vertical-align:0}
body.icons-plain .ibadge{background:transparent;box-shadow:none;color:var(--accent)}
.side button{justify-content:flex-start;padding:6px 10px;gap:10px}
.side button .lbl{flex:1}
.side .ibadge{width:28px;height:28px;border-radius:8px}
.side button.tourhi{outline:3px solid var(--accent);outline-offset:1px;animation:tourp 1.2s ease-in-out infinite}
@keyframes tourp{50%{outline-color:transparent}}
.shell{grid-template-columns:212px minmax(0,1fr)}
/* 3D styles */
body.depth-raised .btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 var(--line),0 3px 6px rgba(0,0,0,.07)}
body.depth-raised .btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
body.depth-raised .card{box-shadow:0 2px 0 var(--line),0 8px 18px rgba(15,27,51,.06)}
body.depth-raised .htile,body.depth-raised .glance{box-shadow:0 3px 0 var(--line),0 6px 14px rgba(15,27,51,.08)}
body.depth-raised .htile:active,body.depth-raised .glance:active{transform:translateY(3px);box-shadow:inset 0 2px 5px rgba(0,0,0,.15)}
body.depth-pressed .btn:not(.primary){background:var(--surface-2);box-shadow:inset 2px 2px 5px rgba(0,0,0,.13),inset -2px -2px 5px rgba(255,255,255,.55)}
body.depth-pressed .card{box-shadow:inset 0 2px 7px rgba(0,0,0,.07)}
body.depth-pressed .htile,body.depth-pressed .glance{box-shadow:inset 2px 2px 7px rgba(0,0,0,.12),inset -2px -2px 7px rgba(255,255,255,.6)}
body.depth-soft .btn{border-color:transparent;box-shadow:4px 4px 10px rgba(0,0,0,.10),-4px -4px 10px rgba(255,255,255,.75)}
body.depth-soft .btn:active:not(:disabled){box-shadow:inset 3px 3px 7px rgba(0,0,0,.12),inset -3px -3px 7px rgba(255,255,255,.7)}
body.depth-soft .card{border-color:transparent;box-shadow:8px 8px 22px rgba(0,0,0,.07),-8px -8px 22px rgba(255,255,255,.75)}
body.depth-soft .htile,body.depth-soft .glance{border-color:transparent;box-shadow:6px 6px 14px rgba(0,0,0,.08),-6px -6px 14px rgba(255,255,255,.8)}
body.depth-glossy .btn{background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(0,0,0,.12)}
body.depth-glossy .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));border-color:var(--accent)}
body.depth-glossy .card{box-shadow:0 4px 16px rgba(0,0,0,.08)}
body.depth-glossy .htile,body.depth-glossy .glance{background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.10)}
.top .btn{box-shadow:none!important;background:rgba(255,255,255,.12)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.depth-soft .btn,:root:not([data-theme="light"]) body.depth-soft .card,:root:not([data-theme="light"]) body.depth-soft .htile{box-shadow:5px 5px 14px rgba(0,0,0,.45),-4px -4px 12px rgba(255,255,255,.04)}}
:root[data-theme="dark"] body.depth-soft .btn,:root[data-theme="dark"] body.depth-soft .card,:root[data-theme="dark"] body.depth-soft .htile{box-shadow:5px 5px 14px rgba(0,0,0,.45),-4px -4px 12px rgba(255,255,255,.04)}
/* home */
.htiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.htile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;color:var(--fg);transition:transform .08s}
.htile .ibadge{grid-row:1 / span 2;width:44px;height:44px;border-radius:12px}
.htile b{font-family:var(--font-d);font-size:15px}
.htile small{color:var(--muted);font-size:12px;line-height:1.3}
.htile:hover{border-color:var(--accent)}
.glances{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.glance{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;color:var(--fg)}
.glance b{display:block;font:600 22px/1.1 var(--font-d)}
.glance small{color:var(--muted);font-size:12px}
.glance.warn{border-color:var(--warn)}.glance.warn b{color:var(--warn)}
.glance.bad{border-color:var(--bad)}.glance.bad b{color:var(--bad)}
.hcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.hbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--hdr);border-radius:8px}
ol.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.todo li{display:flex;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
ol.todo li:first-child{border-top:0}
ol.todo li>span:nth-child(2){flex:1;display:grid}
ol.todo small{color:var(--muted);font-size:12px}
ol.todo .tick{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 12px var(--mono);background:var(--surface-2);color:var(--muted)}
ol.todo li.done .tick{background:var(--ok-bg);color:var(--ok)}
ol.todo li.done b{color:var(--muted);text-decoration:line-through}
.tourstep{display:flex;gap:14px;align-items:flex-start}.tourstep .ibadge{width:52px;height:52px;border-radius:14px}
.tourstep p{font-size:15px}
.secsave{border-top:1px dashed var(--line);padding-top:10px}
.btn.saved{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
/* appearance */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thtile{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--surface);text-align:left;display:grid;color:var(--fg)}
.thtile.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.thsw{height:30px;display:block}
.thbody{display:flex;gap:5px;padding:8px;height:36px}
.thbody i{flex:1;border-radius:5px;background:rgba(0,0,0,.08)}
.thtile b{padding:6px 8px 8px;font-size:12px}
.dsample.d-raised{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 var(--line),0 3px 6px rgba(0,0,0,.1)!important}
.dsample.d-pressed{box-shadow:inset 2px 2px 5px rgba(0,0,0,.15),inset -2px -2px 5px rgba(255,255,255,.5)!important}
.dsample.d-soft{box-shadow:4px 4px 10px rgba(0,0,0,.12),-4px -4px 10px rgba(255,255,255,.8)!important;border-color:transparent}
.dsample.d-glossy{background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 4px rgba(0,0,0,.15)!important}
.dsample.d-flat{box-shadow:none!important}
@media (max-width:760px){.shell{grid-template-columns:1fr}}

.exm td.mcell{min-width:96px}
.exclash{background:var(--bad-bg)!important}
.seatg{display:grid;grid-template-columns:repeat(var(--cols),minmax(92px,1fr));gap:6px}
.seatg .front{grid-column:1 / -1;text-align:center;font:600 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;background:var(--surface-2);border-radius:6px;padding:4px}
.seat{--h:200;border:1px solid hsl(var(--h) 40% var(--pc-bd));background:hsl(var(--h) var(--pc-s) var(--pc-bg));color:hsl(var(--h) 50% var(--pc-fg));border-radius:6px;padding:4px 6px;font-size:11px;line-height:1.25;min-height:46px}
.seat.empty{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.seat small{font:600 10px var(--mono);opacity:.75;display:block}.seat b{display:block}.seat span{display:block;font-size:10px}
.desks{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.desk{border:1.5px solid #333;border-radius:3mm;padding:4mm;display:grid;gap:1mm;break-inside:avoid;font-size:11pt}
.desk b{font-size:16pt}.desk em{font-style:normal;font-weight:600}.desk small{font-size:9pt;color:#444}

.fbars{display:grid;gap:4px}
.fbar{display:grid;grid-template-columns:170px 1fr 50px;gap:8px;align-items:center;font-size:12px}
.fbar.over .fn{color:var(--warn);font-weight:600}
.fbar .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft{position:relative;display:flex;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fbar .ft i{display:block;height:100%}
.fbar .ft em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.6}
.fbar .fv{font:12px var(--mono);text-align:right}
.fp{background:hsl(var(--th-h) 70% 55%)}.fc{background:#e2574c}.fd{background:#e9a23b}.fi{background:#8b5cf6}.fb{background:#14b8a6}
.flegend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.flegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.av3{gap:3px}
.av3 .av{border:1px solid var(--line);border-radius:5px;padding:5px 2px;font-size:11px;background:var(--ok-bg);color:var(--ok)}
.av3 .av.pref{background:var(--warn-bg);color:var(--warn)}
.av3 .av.off{background:var(--bad-bg);color:var(--bad)}
.qpill{cursor:pointer;border:0}
.qpill.qa{background:var(--ok-bg);color:var(--ok)}.qpill.qb{background:var(--accent-bg);color:var(--accent)}.qpill.qc,.qpill.qd{background:var(--warn-bg);color:var(--warn)}.qpill.qd{background:var(--bad-bg);color:var(--bad)}
.qbig{display:flex;gap:14px;align-items:baseline;padding:8px 0}.qbig b{font:700 46px var(--font-d)}.qbig span{font-size:18px;color:var(--muted)}
.qbig.qa b{color:var(--ok)}.qbig.qb b{color:var(--accent)}.qbig.qc b{color:var(--warn)}.qbig.qd b{color:var(--bad)}
.qparts{display:flex;flex-wrap:wrap;gap:6px}
.sicogrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sicogrid .btn{padding:10px}
.sicobtn{color:var(--accent)}

.mwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.mscroll{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mtab{border-collapse:separate;border-spacing:0;font-size:11px;width:max-content}
.mtab th,.mtab td{border-top:1px solid var(--line);padding:0}
.mtab thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);text-align:center;padding:4px 2px;font:600 11px var(--mono)}
.mtab thead tr:nth-child(2) th{top:24px}
.mtab .mh{left:0;z-index:4;min-width:120px}
.mtab .mrow{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 8px;cursor:pointer;min-width:120px;border-right:2px solid var(--line);font:600 12px var(--font)}
.mtab .mrow span{display:block;white-space:nowrap}
.mtab .mrow small{display:block;font:500 10px var(--mono)}
.mtab .mrow small.ok{color:var(--ok)}.mtab .mrow small.warn{color:var(--warn)}
.mtab tr.msel .mrow{background:var(--accent-bg);color:var(--accent)}
.mtab tr.msel td{background:color-mix(in srgb,var(--accent-bg) 45%,transparent)}
.mtab td.mcell{min-width:54px;height:40px;vertical-align:top;border-left:1px solid var(--line);min-height:0}
.mtab .dstart{border-left:2px solid var(--muted)!important}
.mpc{--h:200;margin:2px;border-radius:4px;padding:2px 3px;background:hsl(var(--h) var(--pc-s) var(--pc-bg));color:hsl(var(--h) 50% var(--pc-fg));border:1px solid hsl(var(--h) 40% var(--pc-bd));line-height:1.15;cursor:grab;overflow:hidden}
.mpc b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpc span{display:block;font:10px var(--mono);opacity:.85;white-space:nowrap}
.mpc.cont{opacity:.6;cursor:default}
.mpc.locked{box-shadow:inset 0 0 0 2px hsl(var(--h) 40% var(--pc-bd))}
.mpc.bad{outline:2px solid var(--bad)}
.mcell.na{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--surface-2) 6px 8px)}
.mside{position:sticky;top:70px}
.mprint{border-collapse:collapse;font-size:8px;width:100%}
.mprint th,.mprint td{border:1px solid #888;padding:1px 2px;text-align:center;vertical-align:top}
.mprint small{font-size:7px;color:#444}
.mprintpage h2{font-size:13px;margin-bottom:4px}
.dprev{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.dprev b{display:block}.dprev span{font-size:12px;color:var(--muted)}
.sico{vertical-align:-2px}
@media (max-width:1100px){.mwrap{grid-template-columns:1fr}}

.qrbox{display:grid;justify-items:center;gap:6px;text-align:center}
.qr svg{border:1px solid var(--line);border-radius:8px}
.qrsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.qrcard{border:1px dashed #999;border-radius:3mm;padding:4mm;display:grid;justify-items:center;text-align:center;gap:1mm;break-inside:avoid}

/* ===== v2.1 (batch 8) ===== */
dialog.form{width:min(94vw,540px)}
dialog.wide{width:min(94vw,680px)}
dialog.xl{width:min(96vw,980px)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}

.fbtns{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:2px}

.qsitem span{display:grid}.qsitem small{color:var(--muted);font-size:12px}

.bay{margin-top:12px;border:2px dashed var(--line,#c9d1df);background:var(--card,#fff)}
.bay h2{display:flex;align-items:center;gap:6px;margin:0}
.bay.armed{border-color:#2563eb;background:repeating-linear-gradient(135deg,rgba(37,99,235,.05) 0 8px,rgba(37,99,235,.10) 8px 16px);cursor:copy}

.reason.swap{background:#e8f0fe;color:#1d4ed8;border-color:#93b4f5}

/* v2.2 ID cards: real size is 85.6 x 54 mm = 324 x 204 px at 96 dpi.
   Every design keeps the code in its own zone: a QR code gets a column on the right,
   a barcode gets a strip along the bottom. Details shrink a little (idcFit) when crowded. */
.idc{position:relative;overflow:hidden;border-radius:11px;background:#fff;color:#1a2233;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box;text-align:left;line-height:1.2;flex:none;--ia:#1d3461;--ib:#c8911c;display:flex;flex-direction:column}
.idc *{box-sizing:border-box}
.idc.land{width:324px;height:204px}.idc.port{width:204px;height:324px;align-items:center}
.idc .ilogo{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff;flex:none}
.idc .ilogo.ini{display:flex;align-items:center;justify-content:center;background:var(--ib);color:var(--ia);font-size:11px;font-weight:700}
.idc .iph{width:70px;height:88px;border-radius:6px;object-fit:cover;flex:none;background:#e8ecf4;align-self:flex-start}
.idc .iph.none{display:flex;align-items:flex-end;justify-content:center;color:#a3adc2;padding-top:12px}.idc .iph.none svg{width:80%;height:80%}
.idc .ibody{display:flex;gap:10px;flex:1;min-height:0}
.idc .idet{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.idc .idet.c{align-items:center;text-align:center;width:100%;padding:0 10px}
.idc .iname{font-size:14px;font-weight:700;color:#1a2233;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;flex:none}
.idc .iname.long{font-size:12.5px}
.idc .isub{font-size:11px;color:#556079;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.idc .irow{display:flex;gap:12px;flex:none}
.idc .ikv{display:flex;flex-direction:column;font-size:11px;line-height:1.15;min-width:0;flex:none}
.idc .ikv span{color:#6b7590;font-size:9px}
.idc .ikv b{color:#1a2233;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

<script>
(function(){
'use strict';

/* ---------- constants and helpers ---------- */
var KEY2='schoolTimetabler.v2', KEY='schoolTimetabler.v1', VKEY='schoolTimetabler.versions.v1', TKEY='schoolTimetabler.theme';
var ALL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var ROOM_TYPES=['Classroom','Lab','ICT','Hall','Field','Other'];
var HUES=[[150,'Green'],[180,'Teal'],[205,'Blue'],[230,'Indigo'],[265,'Purple'],[300,'Magenta'],[330,'Pink'],[0,'Red'],[20,'Orange'],[35,'Amber'],[55,'Yellow'],[95,'Lime']];
var D, W, undoS=[], redoS=[];
var ui={tab:'home',view:'master',entity:null,allowClash:false,lift:null,lfilter:'',saveMsg:'',storageOK:true,
        print:{},pendingImport:null};
var lastKey='', lastPush=0, saveTimer=null;

function uid(){return Math.random().toString(36).slice(2,9);}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function by(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function lesson(id){return by(D.lessons,id);}
function lcls(l){return l.classIds||[];}
function lparts(l){return l.parts||[];}
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i;});}
function lTeachers(l){return uniq(lparts(l).map(function(p){return p.teacherId;}).concat(lparts(l).map(function(p){return p.coId;})));}
function lRooms(l){return uniq(lparts(l).map(function(p){return p.roomId;}));}
function lClassNames(l,sep){return lcls(l).map(function(c){return by(D.classes,c)?by(D.classes,c).name:'(no class)';}).join(sep||' + ');}
function lTitle(l){return uniq(lparts(l).map(function(p){return p.subjectId;})).map(function(s){return by(D.subjects,s)?by(D.subjects,s).name:'(no subject)';}).join(' / ');}
function lHas(l,kind,id){if(kind==='learner')return lHasLearner(l,id);return (kind==='class'?lcls(l):kind==='teacher'?lTeachers(l):lRooms(l)).indexOf(id)>=0;}
function lHue(l){var ps=lparts(l);if(ps.length>1)return 215;var s=by(D.subjects,ps[0]&&ps[0].subjectId);return s?s.hue:200;}
function normLesson(l){
  if(!l.parts)l.parts=[{subjectId:l.subjectId||'',teacherId:l.teacherId||'',roomId:l.roomId||'',group:''}];
  if(!l.classIds)l.classIds=l.classId?[l.classId]:[];
  delete l.subjectId;delete l.teacherId;delete l.roomId;delete l.classId;
  if(!l.length)l.length=1;
  return l;
}
function normData(d){if(d&&Array.isArray(d.lessons))d.lessons.forEach(normLesson);if(d&&!d.departments)d.departments=[];return d;}
function normW(w){w.schools.forEach(function(s){s.tts.forEach(function(t){normData(t.data);});});}
function cname(id){var c=by(D.classes,id);return c?c.name:'(no class)';}
function sname(id){var s=by(D.subjects,id);return s?s.name:'(no subject)';}
function tname(id){var t=by(D.teachers,id);return t?t.name:'(no teacher)';}
function rname(id){var r=by(D.rooms,id);return r?r.name:'';}
function abbr(n){return String(n||'').replace(/^(mr|ms|mrs|miss|dr)\.?\s+/i,'').trim().slice(0,3).toUpperCase();}
function tshort(id){var t=by(D.teachers,id);return t?(t.short||abbr(t.name)):'';}
function sshort(id){var s=by(D.subjects,id);return s?(s.short||abbr(s.name)):'';}
function snap(){return JSON.stringify(D);}
function nowHM(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},3200);}

/* ---------- data ---------- */
var P_DEFAULT=[['P1','07:30','08:10',0],['P2','08:10','08:50',0],['P3','08:50','09:30',0],['Break','09:30','09:50',1],
  ['P4','09:50','10:30',0],['P5','10:30','11:10',0],['P6','11:10','11:50',0],['Lunch','11:50','12:30',1],
  ['P7','12:30','13:10',0],['P8','13:10','13:50',0]];
function defaultPeriods(){return P_DEFAULT.map(function(r){return {id:uid(),label:r[0],start:r[1],end:r[2],brk:!!r[3]};});}
function blankData(){return {v:1,sample:false,school:{name:'My School',days:['Mon','Tue','Wed','Thu','Fri'],periods:defaultPeriods()},
  teachers:[],classes:[],subjects:[],rooms:defaultRooms(),lessons:[],placements:[],departments:defaultDepts()};}

function makeSample(){
  var keep=D; var d=blankData(); d.rooms=[]; d.sample=true; d.school.name='Sample Secondary School'; D=d;
  var per=d.school.periods;
  function T(n,s,max,un){var o={id:uid(),name:n,short:s,maxDay:max||0,unav:un||[]};d.teachers.push(o);return o.id;}
  function C(n,z){var o={id:uid(),name:n,size:z||0};d.classes.push(o);return o.id;}
  function S(n,s,h){var o={id:uid(),name:n,short:s,hue:h};d.subjects.push(o);return o.id;}
  function R(n,t,c){var o={id:uid(),name:n,type:t,cap:c||0};d.rooms.push(o);return o.id;}
  function L(c,s,t,r,n,len,note){d.lessons.push({id:uid(),classIds:[c],parts:[{subjectId:s,teacherId:t,roomId:r||'',group:''}],perWeek:n,length:len||1,note:note||''});}
  function LB(cs,ps,n,len,note){d.lessons.push({id:uid(),classIds:cs,parts:ps,perWeek:n,length:len||1,note:note||''});}
  var mul=T('Ms Mulenga','MUL',6),ban=T('Mr Banda','BAN',6),mwa=T('Ms Mwansa','MWA',6),phi=T('Mr Phiri','PHI',6),
      tem=T('Ms Tembo','TEM',6,['Fri|'+per[8].id,'Fri|'+per[9].id]),zul=T('Mr Zulu','ZUL',6),lun=T('Ms Lungu','LUN',6),sak=T('Mr Sakala','SAK',6),dak=T('Mr Daka','DAK',6);
  var c8=C('Grade 8A',32),c9=C('Grade 9A',30),c10=C('IGCSE 10A',24),c11=C('IGCSE 11A',22),as=C('AS Level',14),a2=C('A2 Level',12);
  var eng=S('English','ENG',35),mat=S('Mathematics','MAT',230),bio=S('Biology','BIO',150),che=S('Chemistry','CHE',180),phy=S('Physics','PHY',265),
      his=S('History','HIS',20),geo=S('Geography','GEO',95),ict=S('ICT','ICT',205),pe=S('Physical Education','PE',0);
  var bl=R('Biology Lab','Lab',24),cl=R('Chemistry Lab','Lab',24),pl=R('Physics Lab','Lab',24),ic=R('ICT Suite','ICT',30),fd=R('Sports Field','Field',0);
  R('Room 1','Classroom',30);R('Room 2','Classroom',30);R('Hall','Hall',200);
  [[c8,5],[c9,5]].forEach(function(x){
    L(x[0],eng,mul,'',5);L(x[0],mat,ban,'',5);L(x[0],bio,phi,'',3);L(x[0],che,tem,'',3);L(x[0],phy,zul,'',3);
    L(x[0],his,lun,'',2);
    if(x[0]===c9){LB([c9],[{subjectId:geo,teacherId:lun,roomId:'',group:'Group A'},{subjectId:ict,teacherId:sak,roomId:ic,group:'Group B'},{subjectId:pe,teacherId:dak,roomId:fd,group:'Group C'}],3,1,'Options');}
    else{L(x[0],geo,lun,'',2);L(x[0],ict,sak,ic,2);L(x[0],pe,dak,fd,2);}
  });
  [[c10,ban],[c11,mwa]].forEach(function(x){
    L(x[0],eng,mul,'',4);L(x[0],mat,x[1],'',5);
    L(x[0],bio,phi,'',3,1,'Theory');L(x[0],bio,phi,bl,1,2,'Practical');
    L(x[0],che,tem,'',3,1,'Theory');L(x[0],che,tem,cl,1,2,'Practical');
    L(x[0],phy,zul,'',3,1,'Theory');L(x[0],phy,zul,pl,1,2,'Practical');
    L(x[0],ict,sak,ic,2);
  });
  LB([c10,c11],[{subjectId:pe,teacherId:dak,roomId:fd,group:''}],2,1,'Combined');
  [as,a2].forEach(function(c){
    L(c,mat,mwa,'',5);
    L(c,bio,phi,'',4,1,'Theory');L(c,bio,phi,bl,1,2,'Practical');
    L(c,che,tem,'',4,1,'Theory');L(c,che,tem,cl,1,2,'Practical');
  });
  sampleDepts(d);
  autoFill();
  d.placements.splice(-6,6);
  for(var i=0;i<d.placements.length;i++){var l=lesson(d.placements[i].lessonId);if(l&&l.length===2){d.placements[i].locked=true;break;}}
  D=keep; return d;
}
/* Basic greedy fill used only to seed the sample school. The real generator is planned for version 2. */
function autoFill(){
  var P=D.school.periods,days=D.school.days,units=[];
  D.lessons.forEach(function(l){for(var k=0;k<(l.perWeek||0);k++)units.push(l);});
  units.sort(function(a,b){return (b.length||1)-(a.length||1);});
  units.forEach(function(l,n){
    var best=null,bs=1e9;
    days.forEach(function(d,di){P.forEach(function(per,i){
      if(per.brk)return;
      var r=evalSlot(l.id,d,i,null); if(r.hard.length)return;
      var same=0,cd=0;
      D.placements.forEach(function(p){if(p.day!==d)return;var pl=lesson(p.lessonId);if(p.lessonId===l.id)same++;if(pl&&lcls(pl).some(function(c){return lcls(l).indexOf(c)>=0;}))cd+=(pl.length||1);});
      var sc=same*40+cd*2+i*0.3+((di*7+n*3+i*5)%9)*0.2+(r.soft.length?30:0);
      if(sc<bs){bs=sc;best={d:d,pid:per.id};}
    });});
    if(best)D.placements.push({id:uid(),lessonId:l.id,day:best.d,pid:best.pid,locked:false});
  });
}

/* ---------- clash engine ---------- */
function evalSlot(lessonId,day,idx,ignoreId){
  var L=lesson(lessonId),P=D.school.periods,hard=[],soft=[];
  if(!L)return {hard:[{k:'x',m:'Lesson not found'}],soft:soft};
  var n=L.length||1;
  for(var k=0;k<n;k++){var pr=P[idx+k];if(!pr||pr.brk){hard.push({k:'fit',m:n>1?'Needs '+n+' lesson periods in a row here':'Not a lesson period'});return {hard:hard,soft:soft};}}
  if(P.slice(idx,idx+n).some(function(x){return !!x.act!==!!L.act;}))hard.push({k:'act',m:L.act?'Activities go in after-school activity periods':'This is an after-school activity period'});
  var ids=P.slice(idx,idx+n).map(function(x){return x.id;});
  var lt=lTeachers(L),lr=lRooms(L),lc=lcls(L);
  lt.forEach(function(tid){
    var t=by(D.teachers,tid);
    if(t&&(t.unav||[]).some(function(u){return ids.some(function(id){return u===day+'|'+id;});}))hard.push({k:'avail',m:t.name+' is not available then'});
  });
  var tDay={};

    var pl=lesson(p.lessonId);if(!pl)return;
    var pi=-1;for(var q=0;q<P.length;q++){if(P[q].id===p.pid){pi=q;break;}}
    if(pi<0)return;
    var pn=pl.length||1,pt=lTeachers(pl);
    lt.forEach(function(tid){if(pt.indexOf(tid)>=0)tDay[tid]=(tDay[tid]||0)+pn;});
    if(pi+pn<=idx||pi>=idx+n)return;
    var cc=lc.filter(function(c){return lcls(pl).indexOf(c)>=0;});
    var tg=p.ok?soft:hard;
    if(cc.length)tg.push({k:'class',w:p.id,m:cc.map(cname).join(' + ')+' already has '+lTitle(pl)+' then'});
    lt.forEach(function(tid){if(pt.indexOf(tid)>=0)tg.push({k:'teacher',w:p.id,m:tname(tid)+' is already teaching '+lClassNames(pl)});});
    lr.forEach(function(rid){var rm=by(D.rooms,rid);if(rm&&rm.shared)return;if(lRooms(pl).indexOf(rid)>=0)tg.push({k:'room',w:p.id,m:rname(rid)+' is already used by '+lClassNames(pl)});});
  });
  lt.forEach(function(tid){var t=by(D.teachers,tid);if(t&&t.maxDay>0&&(tDay[tid]||0)+n>t.maxDay)soft.push({k:'load',m:t.name+' would have '+((tDay[tid]||0)+n)+' periods on '+day+' (limit '+t.maxDay+')'});});
  var pupils=lc.reduce(function(s,c){var q=by(D.classes,c);return s+((q&&q.size)||0);},0);
  if(pupils&&lparts(L).length===1)lr.forEach(function(rid){var r=by(D.rooms,rid);if(r&&r.cap>0&&pupils>r.cap)soft.push({k:'cap',m:r.name+' has '+r.cap+' seats but '+lClassNames(L)+' has '+pupils+' pupils'});});
  xsecCheck(L,day,idx,n,soft);
  return {hard:hard,soft:soft};
}
function periodIndex(pid){var P=D.school.periods;for(var i=0;i<P.length;i++){if(P[i].id===pid)return i;}return -1;}
function placedCount(lid){var n=0;D.placements.forEach(function(p){if(p.lessonId===lid)n++;});return n;}
function plIssues(p){var r=evalSlot(p.lessonId,p.day,periodIndex(p.pid),p.id);if(p.ok&&r.hard.length){var fit=r.hard.filter(function(h){return h.k==='fit';});r.soft=r.soft.concat(r.hard.filter(function(h){return h.k!=='fit';}).map(function(h){return {k:h.k,w:h.w,m:'Accepted clash: '+h.m};}));r.hard=fit;}return r;}
function allIssues(){
  var out=[],seen={},P=D.school.periods;
  D.placements.forEach(function(p){
    var l=lesson(p.lessonId);if(!l)return;var i=periodIndex(p.pid);if(i<0)return;
    var r=plIssues(p),where=p.day+' '+P[i].label,pre=where+': '+lTitle(l)+' for '+lClassNames(l)+'. ';
    r.hard.forEach(function(h){var key=h.k+'|'+(h.w?[p.id,h.w].sort().join():p.id);if(seen[key])return;seen[key]=1;out.push({sev:'hard',text:pre+h.m,cls:lcls(l)[0]});});

}

  if(type==='duty'){d.duty={maxWeek:5,posts:[],asg:[]};}

  if(type==='calendar'){d.school.days=ALL_DAYS.slice();d.cal={title:'',start:'',end:'',terms:[],events:[]};}
  return d;
}
/* does teacher tid teach on this day between s and e? (needs the source lesson timetable) */
function teachesAt(dd,tid,day,s,e){
  var P=dd.school.periods;
  return dd.placements.some(function(p){
    if(p.day!==day)return false;var l=by(dd.lessons,p.lessonId);if(!l)return false;
    if(!lparts(l).some(function(q){return q.teacherId===tid||q.coId===tid;}))return false;
    var i=-1;P.forEach(function(x,k){if(x.id===p.pid)i=k;});if(i<0)return false;
    var a=tmin(P[i].start),b=tmin((P[Math.min(P.length-1,i+(l.length||1)-1)]||P[i]).end);
    return a>=0&&b>=0&&ovl(a,b,s,e);
  });
}
function teacherAway(dd,tid,day,s,e){
  var t=by(dd.teachers,tid);if(!t)return false;
  return (t.unav||[]).some(function(k){var a=k.split('|');if(a[0]!==day)return false;var pr=by(dd.school.periods,a[1]);if(!pr)return false;var x=tmin(pr.start),y=tmin(pr.end);return x>=0&&y>=0&&ovl(x,y,s,e);});
}
/* ----- exams ----- */
function exSubj(dd,p){var s=by(dd.subjects,p.subjectId);return (s?s.name:'(no subject)')+(p.label?' '+p.label:'');}
function exTeachesSubject(dd,tid,p){
  return dd.lessons.some(function(l){return lparts(l).some(function(q){return q.teacherId===tid&&q.subjectId===p.subjectId;})&&(!p.classIds.length||lcls(l).some(function(c){return p.classIds.indexOf(c)>=0;}));});
}
function exIssues(d,dd){
  var out=[],ps=d.ex.papers,need=d.ex.need||0;
  function nm(p){return exSubj(dd,p)+(p.date?' on '+dLabel(p.date):'');}
  ps.forEach(function(p){
    if(!p.date)out.push({sev:'hard',text:exSubj(dd,p)+' has no date.'});
    if(tmin(p.start)<0||tmin(p.end)<=tmin(p.start))out.push({sev:'hard',text:nm(p)+': the finish time must be after the start time (use 24 hour times like 08:30).'});
    if(!p.classIds.length)out.push({sev:'soft',text:nm(p)+' has no class.'});
    if(!(p.rooms||[]).length)out.push({sev:'soft',text:nm(p)+' has no room yet.'});
    if((p.invig||[]).length<(p.need==null?need:p.need))out.push({sev:'soft',text:nm(p)+' needs '+(p.need==null?need:p.need)+' invigilator'+((p.need==null?need:p.need)>1?'s':'')+' and has '+(p.invig||[]).length+'.'});
  });
  for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){
    var a=ps[i],b=ps[j];if(!a.date||a.date!==b.date)continue;
    if(!ovl(tmin(a.start),tmin(a.end),tmin(b.start),tmin(b.end)))continue;
    var pair=exSubj(dd,a)+' and '+exSubj(dd,b)+' on '+dLabel(a.date)+' overlap. ';
    a.classIds.filter(function(c){return b.classIds.indexOf(c)>=0;}).forEach(function(c){out.push({sev:'hard',text:pair+(by(dd.classes,c)?by(dd.classes,c).name:'A class')+' has both at the same time.'});});
    (a.invig||[]).filter(function(t){return (b.invig||[]).indexOf(t)>=0;}).forEach(function(t){out.push({sev:'hard',text:pair+(by(dd.teachers,t)?by(dd.teachers,t).name:'A teacher')+' is invigilating both.'});});
    (a.rooms||[]).filter(function(r){return (b.rooms||[]).indexOf(r)>=0;}).forEach(function(r){out.push({sev:'soft',text:pair+(by(dd.rooms,r)?by(dd.rooms,r).name:'A room')+' holds both papers at once. This is fine if the room is big enough for both.'});});
  }
  var per={};ps.forEach(function(p){if(!p.date)return;p.classIds.forEach(function(c){var k=c+'|'+p.date;(per[k]=per[k]||[]).push(p);});});
  Object.keys(per).forEach(function(k){if(per[k].length>2){var c=by(dd.classes,k.split('|')[0]);out.push({sev:'soft',text:(c?c.name:'A class')+' has '+per[k].length+' papers on '+dLabel(per[k][0].date)+'.'});}});
  return out;
}
function exAuto(d,dd,clear){
  var ps=d.ex.papers.slice().sort(function(a,b){return String(a.date).localeCompare(b.date)||tmin(a.start)-tmin(b.start);});
  if(clear)ps.forEach(function(p){p.invig=[];});
  var load={};dd.teachers.forEach(function(t){load[t.id]=0;});
  ps.forEach(function(p){(p.invig||[]).forEach(function(t){load[t]=(load[t]||0)+Math.max(0,tmin(p.end)-tmin(p.start));});});
  var short=0;
  ps.forEach(function(p){
    var need=(p.need==null?d.ex.need:p.need)||0;p.invig=p.invig||[];
    var s=tmin(p.start),e=tmin(p.end),dur=Math.max(0,e-s);
    function busy(t){return ps.some(function(q){return q!==p&&q.date===p.date&&(q.invig||[]).indexOf(t.id)>=0&&ovl(tmin(q.start),tmin(q.end),s,e);});}
    while(p.invig.length<need){
      var c=dd.teachers.filter(function(t){return p.invig.indexOf(t.id)<0&&!busy(t);});
      var pref=c.filter(function(t){return !exTeachesSubject(dd,t.id,p);});if(pref.length)c=pref;
      c.sort(function(a,b){return (load[a.id]||0)-(load[b.id]||0);});
      if(!c.length){short++;break;}
      p.invig.push(c[0].id);load[c[0].id]=(load[c[0].id]||0)+dur;
    }
  });
  return short;
}
function exDates(d){return uniq(d.ex.papers.map(function(p){return p.date;}).filter(Boolean)).sort();}
function exSession(d,p){return tmin(p.start)<tmin(d.ex.cut||'12:30')?0:1;}
/* ----- duty ----- */
function dutyPostDays(po,d){return po.days&&po.days.length?po.days:d.school.days;}
function dutyIssues(d,dd){
  var out=[],posts=d.duty.posts,cnt={};
  function tn(id){return by(dd.teachers,id)?by(dd.teachers,id).name:'A teacher';}
  d.duty.asg.forEach(function(a){cnt[a.teacherId]=(cnt[a.teacherId]||0)+1;});
  posts.forEach(function(po){
    var s=tmin(po.start),e=tmin(po.end);
    if(s<0||e<=s)out.push({sev:'hard',text:'Post "'+po.name+'": the finish time must be after the start time.'});
    d.school.days.forEach(function(day){
      if(dutyPostDays(po,d).indexOf(day)<0)return;
      var as=d.duty.asg.filter(function(a){return a.postId===po.id&&a.day===day;});
      if(as.length<(po.need||1))out.push({sev:'soft',text:po.name+' on '+day+' needs '+(po.need||1)+' and has '+as.length+'.'});
      as.forEach(function(a){
        if(teachesAt(dd,a.teacherId,day,s,e))out.push({sev:'hard',text:tn(a.teacherId)+' is on '+po.name+' duty on '+day+' while teaching a lesson.'});
        else if(teacherAway(dd,a.teacherId,day,s,e))out.push({sev:'soft',text:tn(a.teacherId)+' marked '+day+' at '+po.start+' as unavailable but is on '+po.name+' duty.'});
      });
    });
  });
  d.duty.asg.forEach(function(a,i){
    var p1=by(posts,a.postId);if(!p1)return;
    for(var j=i+1;j<d.duty.asg.length;j++){var b=d.duty.asg[j],p2=by(posts,b.postId);
      if(!p2||b.teacherId!==a.teacherId||b.day!==a.day||b.postId===a.postId)continue;
      if(ovl(tmin(p1.start),tmin(p1.end),tmin(p2.start),tmin(p2.end)))out.push({sev:'hard',text:tn(a.teacherId)+' is on '+p1.name+' and '+p2.name+' duty at the same time on '+a.day+'.'});}
  });
  var ids=dd.teachers.map(function(t){return t.id;});
  if(d.duty.asg.length&&ids.length>1){
    var mx=ids.reduce(function(m,t){return (cnt[t]||0)>(cnt[m]||0)?t:m;},ids[0]),mn=ids.reduce(function(m,t){return (cnt[t]||0)<(cnt[m]||0)?t:m;},ids[0]);
    if((cnt[mx]||0)-(cnt[mn]||0)>1)out.push({sev:'soft',text:'Duties are uneven: '+tn(mx)+' has '+(cnt[mx]||0)+' a week and '+tn(mn)+' has '+(cnt[mn]||0)+'.'});
  }
  ids.forEach(function(t){if(d.duty.maxWeek&&(cnt[t]||0)>d.duty.maxWeek)out.push({sev:'soft',text:tn(t)+' has '+cnt[t]+' duties, more than the limit of '+d.duty.maxWeek+' a week.'});});
  return out;
}
function dutyAuto(d,dd,clear){
  if(clear)d.duty.asg=[];
  var cnt={};dd.teachers.forEach(function(t){cnt[t.id]=0;});d.duty.asg.forEach(function(a){cnt[a.teacherId]=(cnt[a.teacherId]||0)+1;});
  var miss=0,mx=d.duty.maxWeek||99;
  d.school.days.forEach(function(day){d.duty.posts.forEach(function(po){
    if(dutyPostDays(po,d).indexOf(day)<0)return;
    var s=tmin(po.start),e=tmin(po.end);
    function have(){return d.duty.asg.filter(function(a){return a.postId===po.id&&a.day===day;});}
    while(have().length<(po.need||1)){
      var c=dd.teachers.filter(function(t){
        if(have().some(function(a){return a.teacherId===t.id;}))return false;
        if(teachesAt(dd,t.id,day,s,e)||teacherAway(dd,t.id,day,s,e))return false;
        return !d.duty.asg.some(function(a){var q=by(d.duty.posts,a.postId);return a.teacherId===t.id&&a.day===day&&q&&ovl(tmin(q.start),tmin(q.end),s,e);});
      });
      var ok=c.filter(function(t){return cnt[t.id]<mx;});if(ok.length)c=ok;
      c.sort(function(a,b){return cnt[a.id]-cnt[b.id];});
      if(!c.length){miss++;break;}
      d.duty.asg.push({id:uid(),postId:po.id,day:day,teacherId:c[0].id});cnt[c[0].id]++;
    }
  });});
  return miss;
}

function bdIssues(d,dd){

  for(var i=0;i<B.length;i++)for(var j=i+1;j<B.length;j++)if(ovl(tmin(B[i].start),tmin(B[i].end),tmin(B[j].start),tmin(B[j].end)))out.push({sev:'hard',text:'"'+B[i].label+'" and "'+B[j].label+'" overlap in time.'});
  d.bd.houses.forEach(function(h){

    B.forEach(function(b){if(!b.sup)return;d.school.days.forEach(function(day){var c=bdCell(d,h.id,b.id,day);if(!c||!(c.staff||[]).length)miss++;});});

function generate(opts){

  var tload={};D.teachers.forEach(function(t){tload[t.id]=((t.unav||[]).length)/6;});
  function diff(l){var s=((l.length||1)-1)*5+lTeachers(l).length*2+lcls(l).length*2+(lparts(l).length>1?3:0)+lRooms(l).length*1.5;lTeachers(l).forEach(function(t){s+=tload[t]||0;});return s;}

   .catch(function(e){BK.busy=false;BK.err=String(e&&e.message||e);if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))BK.perm='prompt';if(manual)toast('Backup to folder failed: '+BK.err);render();return false;});

var LKEY='schoolTimetabler.licence',TRKEY='schoolTimetabler.trial',TRIAL_DAYS=30;
var LIC_PUB={"kty": "EC", "x": "R-EvVEqMmtvIvTs0QeRl6hkdVwK_VUHPVBMOvunOPjM", "y": "Vw_gbm9fgQvqMD4O3Iu_l0akUdArhpcN-tM63Kx1E9k", "crv": "P-256"};
var lic={state:'checking',info:null};
function b64uDec(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function verifyKey(key){
  key=String(key||'').replace(/\s+/g,'');
  var m=key.split('.');if(m.length!==3||m[0]!=='STT1')return Promise.resolve(null);
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error('nocrypto'));
  var payload,sig;try{payload=b64uDec(m[1]);sig=b64uDec(m[2]);}catch(e){return Promise.resolve(null);}
  return crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify'])
    .then(function(k){return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,sig,payload);})
    .then(function(ok){if(!ok)return null;try{return JSON.parse(new TextDecoder().decode(payload));}catch(e){return null;}},function(){return null;});
}
function trialStart(){var t='';try{t=localStorage.getItem(TRKEY)||'';if(!t){t=isoDate(new Date());localStorage.setItem(TRKEY,t);}}catch(e){t=isoDate(new Date());}return t;}

function checkLicence(){
  var k='';try{k=localStorage.getItem(LKEY)||'';}catch(e){}
  if(!k){lic={state:trialLeft()>0?'trial':'expired',info:null};return Promise.resolve(lic);}
  return verifyKey(k).then(function(info){
    if(!info)lic={state:trialLeft()>0?'trial':'expired',info:null,bad:true};
    else if(info.exp&&info.exp<isoDate(new Date()))lic={state:'lapsed',info:info};
    else lic={state:'valid',info:info};

  },function(){lic={state:'nocrypto',info:null};return lic;});
}

var CSV_COLS={
  teachers:[['name','teacher','full name','teacher name'],['short name','short','code','initials','abbreviation'],['max periods a day','max per day','maxday','max periods','max']],
  classes:[['name','class','class or set','set','class name'],['pupils','size','number of pupils','students','learners','class size']],
  subjects:[['name','subject','subject name'],['short name','short','code','abbreviation']],

  lessons:[['class','classes','class or set'],['subject','subjects'],['teacher','teachers'],['room','rooms'],['per week','perweek','periods per week','lessons per week','periods'],['length','duration'],['note','notes'],['groups','group']]
};

  classes:'Name,Pupils\nGrade 8A,32\nGrade 8B,30',
  subjects:'Name,Short name\nBiology,BIO\nMathematics,MAT',
  rooms:'Name,Type,Capacity\nBiology Lab,Lab,24\nRoom 12,Classroom,40',
  lessons:'Class,Subject,Teacher,Room,Per week,Length,Note,Groups\nIGCSE 10A,Biology,Mr Phiri,Biology Lab,1,2,Practical,\nIGCSE 10A + IGCSE 11A,PE,Mr Daka,Sports Field,2,1,Combined,\nGrade 9A,Geography|ICT|PE,Ms Lungu|Mr Sakala|Mr Daka,|ICT Suite|Sports Field,3,1,Options,A|B|C'
};
function parseCsv(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  var first=txt.split(/\r?\n/)[0]||'',nc=first.split(',').length,ns=first.split(';').length,nt=first.split('\t').length;
  var dl=nt>nc&&nt>=ns?'\t':ns>nc?';':',';
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"'&&f==='')q=true;
    else if(c===dl){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}

}
function csvMap(ent,rows){

  if(idx[0]<0)return {rows:rows,head:false};
  return {head:true,rows:rows.slice(1).map(function(r){return idx.map(function(j){return j>=0?(r[j]||''):'';});})};

function xsecMap(){
  var t=curTT(),s=curSchool();
  if(!t||!s||ttType(t)!=='class'||!ttSection(t)||setting('xsec')===false)return null;
  if(XS.key===t.id&&XS.map)return XS.map;
  var m={t:{},r:{}};
  s.tts.forEach(function(o){
    if(o===t||ttType(o)!=='class'||!ttSection(o)||ttSection(o)===ttSection(t))return;
    if(t.week&&o.week&&t.week!==o.week)return;
    var d=o.data,P=d.school.periods;

      var i=-1;P.forEach(function(x,k){if(x.id===p.pid)i=k;});if(i<0)return;
      var pe=P[Math.min(P.length-1,i+(l.length||1)-1)],a=tmin(P[i].start),b=tmin(pe.end);if(a<0||b<0)return;
      var subj=uniq(lparts(l).map(function(q){return q.subjectId;})).map(function(id){var x=by(d.subjects,id);return x?x.name:'';}).join(' / ');
      var cls=lcls(l).map(function(id){var x=by(d.classes,id);return x?x.name:'';}).join(' + ');
      var what=ttSection(o)+' ('+subj+(cls?', '+cls:'')+', '+P[i].start+' to '+pe.end+')';

      });
    });
  });

}

/* minimal ZIP writer (stored, no compression) */
var CRCT=(function(){var t=[],c;for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function makeZip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0;
  function u16(v){return [v&255,(v>>8)&255];}function u32(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];}
  files.forEach(function(f){
    var nm=enc.encode(f.name),dt=f.data instanceof Uint8Array?f.data:enc.encode(f.data),cr=crc32(dt);
    var lh=[].concat([0x50,0x4b,3,4],u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(cr),u32(dt.length),u32(dt.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,dt);
    cen.push([[].concat([0x50,0x4b,1,2],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(cr),u32(dt.length),u32(dt.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off)),nm]);
    off+=lh.length+nm.length+dt.length;
  });
  var cs=0;cen.forEach(function(c){parts.push(new Uint8Array(c[0]),c[1]);cs+=c[0].length+c[1].length;});
  parts.push(new Uint8Array([].concat([0x50,0x4b,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0))));
  return new Blob(parts,{type:'application/zip'});
}

function tryPlace(day,idx){
  var lf=ui.lift;if(!lf)return;
  var per=D.school.periods[idx],lid=lf.type==='new'?lf.lessonId:(by(D.placements,lf.plId)||{}).lessonId;
  if(!lid||!per)return;
  if(lf.type==='new'){var l=lesson(lid);if(placedCount(lid)>=(l.perWeek||0)){toast('All lessons of this kind are already placed');ui.lift=null;render();return;}}
  var r=evalSlot(lid,day,idx,lf.type==='move'?lf.plId:null);
  var fit=r.hard.filter(function(h){return h.k==='fit';});
  if(fit.length){toast(fit[0].m);return;}
  function go(ok){
    mutate(function(){
      if(lf.type==='new'){var np={id:uid(),lessonId:lid,day:day,pid:per.id,locked:false};if(ok)np.ok=true;D.placements.push(np);}
      else{var p=by(D.placements,lf.plId);if(!p)return;p.day=day;p.pid=per.id;if(ok)p.ok=true;else delete p.ok;}
    });
    ui.lift=null;paintHints();
  }
  if(r.hard.length&&!ui.allowClash){
    if(setting('clashAsk')===false){toast(r.hard[0].m);return;}
    ui.pendingPlace=go;
    openModal('Place anyway?','<p><b>'+esc(day+' '+per.label)+'</b> clashes:</p><ul class="issues">'+uniq(r.hard.map(function(h){return h.m;})).map(function(m){return '<li class="bad">'+esc(m)+'</li>';}).join('')+'</ul>'+
      '<p class="muted">Place it anyway if this is intended, for example two classes sharing one room for a combined activity. It is then listed as an accepted clash, not an error.</p>'+
      '<div class="row"><button class="btn danger" data-act="b4-place-anyway">Place anyway</button><button class="btn" data-act="close">Cancel</button></div>');
    return;
  }
  go(false);
  if(r.hard.length)toast('Placed with a clash. It is shown in red.');
}

function calIcs(){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Infinity Timetable//EN','CALSCALE:GREGORIAN'],stamp=isoDate(new Date()).replace(/-/g,'')+'T000000Z';
  calOf().events.forEach(function(ev){
    if(!ev.date)return;
    L.push('BEGIN:VEVENT','UID:'+ev.id+'@schooltimetabler','DTSTAMP:'+stamp);
    if(ev.allDay!==false||!ev.start){L.push('DTSTART;VALUE=DATE:'+ev.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(ev.to&&ev.to>=ev.date?ev.to:ev.date,1).replace(/-/g,''));}
    else{L.push('DTSTART:'+icsDate(ev.date,ev.start),'DTEND:'+icsDate(ev.to&&ev.to>=ev.date?ev.to:ev.date,ev.end||ev.start));}
    L.push('SUMMARY:'+icsEsc(ev.title+(evStopTxt(ev)?' ('+evStopTxt(ev)+')':'')),'CATEGORIES:'+icsEsc(catOf(ev.cat)[1]));
    if(ev.where)L.push('LOCATION:'+icsEsc(ev.where));if(ev.note)L.push('DESCRIPTION:'+icsEsc(ev.note));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}

    var key=el.dataset.k,v=el.type==='checkbox'?el.checked:el.type==='number'?(+el.value||0):el.value;
    if(txt&&type==='change')return;if(!txt&&type==='input')return;
    sset()[key]=v;XS.key='';syncActive();persist();
    if(!txt)render();else updateChrome();
    if(txt&&/^w/.test(key))renderNav();
    return;
  }
  if(type==='input'&&!txt)return;
  if(type==='change'&&txt&&f!=='pert')return;
  if(f==='section'){var t=curTT();t.section=el.value.trim();if(!t.section)delete t.section;XS.key='';syncActive();persist();updateChrome();return;}
  if(f==='ripple'){mutate(function(){D.school.ripple=el.checked;});return;}
  if(f==='pert'){
    var p=by(D.school.periods,el.dataset.id);if(!p)return;var fld=el.dataset.f;
    if(type==='input'){if(tmin(el.value)>=0)mutate(function(){p[fld]=el.value;},{key:'pert'+p.id+fld,render:false});return;}
    if(el._done||!el.isConnected)return;el._done=true;
    var nv=tmin(el.value);if(nv<0){toast('Enter a time like 07:30');render();return;}
    var orig=tmin(el.defaultValue);
    mutate(function(){
      var i=D.school.periods.indexOf(p);
      if(fld==='start'){var dl=orig>=0?nv-orig:0;p.start=hm(nv);if(D.school.ripple!==false&&dl&&tmin(p.end)>=0){p.end=hm(tmin(p.end)+dl);shiftAfter(i,dl);}}
      else{p.end=hm(nv);if(D.school.ripple!==false&&orig>=0)shiftAfter(i,nv-orig);}
    });
    return;
  }
  if(f==='permin'){if(el._done||!el.isConnected)return;el._done=true;var p2=by(D.school.periods,el.dataset.id),mn=Math.max(1,Math.floor(+el.value||0));if(!p2||tmin(p2.start)<0)return;mutate(function(){var old=tmin(p2.end),ne=tmin(p2.start)+mn;p2.end=hm(ne);if(D.school.ripple!==false&&old>=0)shiftAfter(D.school.periods.indexOf(p2),ne-old);});return;}
  if(f==='pertype'){var p3=by(D.school.periods,el.dataset.id);if(!p3)return;mutate(function(){p3.brk=el.value==='brk';if(el.value==='act')p3.act=true;else delete p3.act;});return;}
  if(f==='calset'){mutate(function(){calOf()[el.dataset.f]=el.value;},txt?{key:'calset'+el.dataset.f,render:false}:{});return;}
  if(f==='term'){var tm=by(calOf().terms,el.dataset.id);if(tm)mutate(function(){tm[el.dataset.f]=el.value;},txt?{key:'term'+tm.id+el.dataset.f,render:false}:{});return;}
}

function fileSave(asNew){
  var txt=fileText(),nm=(SN()||'School').replace(/[^\w\- ]+/g,'').trim()+'.stt';
  if(HOST){
    if(FILE&&FILE.path&&!asNew)return hostCall('save',{path:FILE.path,text:txt}).then(function(r){if(r.ok){FILE.dirty=false;FILE.saved=Date.now();updateChrome();}else toast(r.error||'Could not save');return r.ok;});
    return hostCall('saveas',{name:nm,text:txt}).then(function(r){if(r.ok){setFile({path:r.path,name:r.name});toast('Saved as '+r.name);}return r.ok;});
  }
  if(window.showSaveFilePicker){
    var go=function(h){return h.createWritable().then(function(w){return w.write(txt).then(function(){return w.close();});}).then(function(){if(!FILE||FILE.handle!==h)setFile({name:h.name,handle:h});else{FILE.dirty=false;FILE.saved=Date.now();updateChrome();}return true;});};
    if(FILE&&FILE.handle&&!asNew)return go(FILE.handle).catch(function(){toast('Could not save. Use Save as.');});

function pinOk(mode){
  var a=($('#pin-a')||{}).value||'',b=($('#pin-b')||{}).value||'',c=($('#pin-c')||{}).value||'',p=W.prefs.pin;
  var check=p&&mode!=='set'?pinHash(a,p.salt).then(function(h){return h===p.hash;}):Promise.resolve(true);

    if(!good){toast('That PIN is not right');var f=$('#pin-a');if(f){f.value='';f.focus();}return;}
    if(mode==='unlock'){ui.unlocked=true;closeModal();render();toast('Unlocked. Changes are allowed until you lock again or close the app.');return;}

    {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+wb+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'<Relationship Id="rId'+(n+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},

/* --- shared: today in a lesson timetable --- */
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function todayDay(){return ALL_DAYS[(new Date().getDay()+6)%7];}
function classTTs(){var s=curSchool();return s?s.tts.filter(function(t){return ttType(t)==='class';}):[];}
function periodNow(d,m){
  var P=d.school.periods,cur=-1,next=-1;
  P.forEach(function(p,i){var a=tmin(p.start),b=tmin(p.end);if(a<0||b<0)return;if(m>=a&&m<b)cur=i;if(next<0&&a>m)next=i;});
  return {cur:cur,next:next,P:P};
}
function lessonsAt(t,day,idx){
  var d=t.data,out=[];if(idx<0)return out;
  d.placements.forEach(function(p){
    if(p.day!==day)return;var l=by(d.lessons,p.lessonId);if(!l)return;
    var i=-1;d.school.periods.forEach(function(x,k){if(x.id===p.pid)i=k;});
    if(i<0||idx<i||idx>=i+(l.length||1))return;
    out.push({l:l,d:d,t:t});
  });
  return out;
}

var LIVE={on:false,timer:null,page:0,tick:0};
function liveOpen(){
  LIVE.on=true;LIVE.page=0;var el=$('#live');el.hidden=false;liveDraw();
  clearInterval(LIVE.timer);LIVE.timer=setInterval(function(){LIVE.tick++;if(LIVE.tick%12===0)LIVE.page++;var c=$('#liveClock');if(c)c.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});if(LIVE.tick%12===0||new Date().getSeconds()===0)liveDraw();},1000);

function liveDraw(){var _dc=DCTX;DCTX='live';try{liveDraw0();}finally{DCTX=_dc;}}
function liveDraw0(){
  var el=$('#live');if(!el||!LIVE.on)return;
  var s=curSchool(),tts=classTTs(),today=isoDate(new Date()),day=todayDay(),m=nowMin();
  var main=tts.filter(function(t){return t.id===W.cur.t;})[0]||tts[0];
  var status='',sub='',left='';
  if(!main)status='No lesson timetable yet';
  else{
    var pn=periodNow(main.data,m),P=pn.P,teach=main.data.school.days.indexOf(day)>=0,hol=isHol(today,main.data);
    if(!teach)status='No lessons today';else if(hol)status='No lessons today';
    else if(pn.cur>=0){var p=P[pn.cur];status=(p.brk?p.label:p.label)+' · '+p.start+' to '+p.end;left=Math.max(0,tmin(p.end)-m)+' min left';sub=pn.next>=0?'Next: '+P[pn.next].label+' at '+P[pn.next].start:'Last period of the day';}
    else if(pn.next>=0){status='Before '+P[pn.next].label;sub='Starts at '+P[pn.next].start;}
    else status='Lessons have finished for today';
    if(hol){var ev=calStop(main,today,null,null);sub=ev?ev.title:'Holiday';}
  }
  /* now in class */
  var rows=[];
  tts.forEach(function(t){
    if(t.data.school.days.indexOf(day)<0||isHol(today,t.data))return;
    var pn=periodNow(t.data,m);if(pn.cur<0||pn.P[pn.cur].brk)return;
    if(t.week&&weekOf(today,t.data)&&weekOf(today,t.data)!==t.week)return;

/* --- bell ringer --- */
var BELL={ctx:null,last:'',timer:null};
function bellCfg(){var o=sset();o.bell=o.bell||{};var b=o.bell;if(b.on==null)b.on=false;if(!b.sound)b.sound='school';if(b.vol==null)b.vol=0.8;if(!b.len)b.len=4;if(!b.at)b.at='all';if(b.endDay==null)b.endDay=true;return b;}
function bellTT(){var b=bellCfg(),ts=classTTs();return ts.filter(function(t){return t.id===b.ttId;})[0]||ts.filter(function(t){return t.id===W.cur.t;})[0]||ts[0];}
function bellTimes(t){
  var b=bellCfg(),P=t?t.data.school.periods:[],out=[];
  P.forEach(function(p){if(tmin(p.start)<0)return;if(b.at==='lessons'&&(p.brk||p.act))return;if(b.at!=='all'&&b.at!=='lessons')return;out.push({m:tmin(p.start),label:p.label});});
  if(b.endDay){var last=P.filter(function(p){return !p.brk&&!p.act&&tmin(p.end)>=0;}).pop();if(last)out.push({m:tmin(last.end),label:'End of the school day'});}
  var seen={};return out.filter(function(x){if(seen[x.m])return false;seen[x.m]=1;return true;}).sort(function(a,b2){return a.m-b2.m;});
}
function bellNext(){var t=bellTT();if(!t)return null;var today=isoDate(new Date()),m=nowMin();if(t.data.school.days.indexOf(todayDay())<0||isHol(today,t.data))return null;return bellTimes(t).filter(function(x){return x.m>m;})[0]||null;}
function bellCheck(){
  var b=bellCfg();if(!b.on)return;var t=bellTT();if(!t)return;
  var now=new Date(),today=isoDate(now),m=now.getHours()*60+now.getMinutes();
  if(t.data.school.days.indexOf(todayDay())<0||isHol(today,t.data))return;
  var hit=bellTimes(t).filter(function(x){return x.m===m;})[0];if(!hit)return;
  var key=today+'|'+m;if(BELL.last===key)return;BELL.last=key;ringBell(b.sound,b.len,b.vol);
}
function audio(){if(!BELL.ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;BELL.ctx=new C();}if(BELL.ctx.state==='suspended')BELL.ctx.resume();return BELL.ctx;}
function ringBell(sound,len,vol){
  var c=audio();if(!c)return;var t0=c.currentTime+0.05,g=c.createGain();g.gain.value=Math.max(0,Math.min(1,vol==null?0.8:vol));g.connect(c.destination);len=+len||4;
  function tone(f,start,dur,type,peak){var o=c.createOscillator(),e=c.createGain();o.type=type||'sine';o.frequency.value=f;e.gain.setValueAtTime(0.0001,start);e.gain.exponentialRampToValueAtTime(peak||0.5,start+0.01);e.gain.exponentialRampToValueAtTime(0.0001,start+dur);o.connect(e);e.connect(g);o.start(start);o.stop(start+dur+0.05);}
  if(sound==='school'){for(var k=0;k<len*14;k++){var st=t0+k/14;tone(1046,st,0.09,'square',0.18);tone(2350,st,0.07,'sine',0.12);}}
  else if(sound==='chime'){var notes=[784,659,523,392];for(var r=0;r<Math.max(1,Math.round(len/3));r++)notes.forEach(function(f,i){tone(f,t0+r*3+i*0.6,1.6,'sine',0.5);tone(f*2,t0+r*3+i*0.6,0.8,'sine',0.12);});}
  else if(sound==='buzzer'){var o=c.createOscillator(),e=c.createGain();o.type='sawtooth';o.frequency.value=180;e.gain.setValueAtTime(0.0001,t0);e.gain.exponentialRampToValueAtTime(0.35,t0+0.03);e.gain.setValueAtTime(0.35,t0+len-0.1);e.gain.exponentialRampToValueAtTime(0.0001,t0+len);o.connect(e);e.connect(g);o.start(t0);o.stop(t0+len+0.1);}
  else{for(var s=0;s<Math.max(1,Math.round(len/1.2));s++){[1,2.76,5.4].forEach(function(mul,j){tone(660*mul,t0+s*1.2,1.1-j*0.3,'sine',0.45/(j+1));});}}
}
function bellStart(){clearInterval(BELL.timer);BELL.timer=setInterval(bellCheck,1000);document.addEventListener('pointerdown',function(){if(BELL.ctx&&BELL.ctx.state==='suspended')BELL.ctx.resume();},{passive:true});}
function bellPill(){var b=bellCfg();if(!b.on)return '';var n=bellNext();return '<span class="pill ok" title="The bell rings while Infinity Timetable is open">Bell on'+(n?' · next '+hm(n.m):'')+'</span>';}
function bellCard(){
  var b=bellCfg(),ts=classTTs(),t=bellTT(),times=bellTimes(t);
  return '<section class="card"><h2>Bell ringer</h2><p class="muted">The computer rings the bell through its speakers at each period change, on teaching days only, and not on holidays or school closures. Infinity Timetable must stay open, for example on the office PC.</p>'+
    '<label class="row" style="gap:6px"><input type="checkbox" data-b6="bell" data-k="on"'+(b.on?' checked':'')+'> Ring the bell</label>'+
    '<div class="row" style="gap:14px"><label class="f">Bell times from<select class="in" data-b6="bell" data-k="ttId" style="width:auto">'+ts.map(function(x){return '<option value="'+x.id+'"'+(t&&t.id===x.id?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select></label>'+
    '<label class="f">Sound<select class="in" data-b6="bell" data-k="sound" style="width:auto">'+[['school','Electric school bell'],['bell','Hand bell'],['chime','Chime'],['buzzer','Buzzer']].map(function(o){return '<option value="'+o[0]+'"'+(b.sound===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label>'+
    '<label class="f">Length<select class="in" data-b6="bell" data-k="len" style="width:auto">'+[2,3,4,6,8,10].map(function(n){return '<option value="'+n+'"'+(+b.len===n?' selected':'')+'>'+n+' seconds</option>';}).join('')+'</select></label>'+
    '<label class="f">Volume<input type="range" min="0" max="1" step="0.05" data-b6="bell" data-k="vol" value="'+b.vol+'"></label></div>'+
    '<div class="row" style="gap:14px"><label class="f">Ring at<select class="in" data-b6="bell" data-k="at" style="width:auto"><option value="all"'+(b.at==='all'?' selected':'')+'>The start of every period and break</option><option value="lessons"'+(b.at==='lessons'?' selected':'')+'>The start of lessons only</option></select></label><label class="row" style="gap:6px;align-self:end"><input type="checkbox" data-b6="bell" data-k="endDay"'+(b.endDay?' checked':'')+'> Ring at the end of the school day</label></div>'+
    '<div class="row"><button class="btn" data-act="b6-bell-test">Test the bell</button><span class="muted">'+(times.length?times.length+' bells a day: '+esc(times.map(function(x){return hm(x.m);}).join(', ')):'Set bell times on the Setup page first.')+'</span></div></section>';
}

/* --- room booking --- */
function bookings(){if(!D.bookings)D.bookings=[];return D.bookings;}
function bookIdx(b){return periodIndex(b.pid);}
function roomRegular(rid,day,i){var r=by(D.rooms,rid);var out=[];D.placements.forEach(function(p){if(p.day!==day)return;var l=lesson(p.lessonId);if(!l||lRooms(l).indexOf(rid)<0)return;var pi=periodIndex(p.pid);if(pi<0||i<pi||i>=pi+(l.length||1))return;out.push(l);});return out;}
function bookAt(rid,date,i){return bookings().filter(function(b){var bi=bookIdx(b);return b.roomId===rid&&b.date===date&&bi>=0&&i>=bi&&i<bi+(b.n||1);});}
function bookClashes(b,ignore){
  var day=dayOf(b.date),i0=bookIdx(b),out=[],r=by(D.rooms,b.roomId);
  for(var i=i0;i<i0+(b.n||1);i++){
    var P=D.school.periods[i];if(!P){out.push('The booking runs past the last period');break;}
    if(P.brk)continue;
    if(!(r&&r.shared)){roomRegular(b.roomId,day,i).forEach(function(l){out.push(P.label+': '+(r?r.name:'The room')+' has '+lTitle(l)+' with '+lClassNames(l));});
      bookAt(b.roomId,b.date,i).forEach(function(x){if(x.id!==ignore)out.push(P.label+': already booked for '+(x.what||tname(x.teacherId)));});}
    if(b.teacherId){D.placements.forEach(function(p){if(p.day!==day)return;var l=lesson(p.lessonId);if(!l||lTeachers(l).indexOf(b.teacherId)<0)return;var pi=periodIndex(p.pid);if(pi>=0&&i>=pi&&i<pi+(l.length||1))out.push(P.label+': '+tname(b.teacherId)+' teaches '+lTitle(l)+' with '+lClassNames(l));});}
  }
  return uniq(out);
}

      if(reg.length&&!r.shared)return '<td class="bk-r" title="Regular lesson">'+esc(lTitle(reg[0]))+'<small>'+esc(lClassNames(reg[0]))+'</small></td>';

    }).join('')+'</tr>';}).join('')+'</tbody></table></div></section>';
